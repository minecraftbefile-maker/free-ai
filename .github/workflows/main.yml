          # ---------- dashboard.html ----------
          cat > proxy/templates/dashboard.html << 'HTMLEOF'
          {% extends "base.html" %}
          {% block title %}Dashboard{% endblock %}
          {% block body %}
          <div class="container">
            <div class="header">
              <div class="logo">🚀 <span>LLM Proxy</span></div>
              <div class="row">
                <a href="/" class="nav-link active">Dashboard</a>
                <a href="/store" class="nav-link">Model Store</a>
                <span class="muted" style="margin: 0;">{{ user }}</span>
                <a href="/logout" class="btn btn-secondary">Logout</a>
              </div>
            </div>

            {% if error %}<div class="error">{{ error }}</div>{% endif %}

            <div class="card">
              <div class="card-header">
                <h2>Current Model</h2>
                {% if current == "None" %}
                  <span class="badge notloaded">no model loaded</span>
                {% else %}
                  <span class="badge loaded">● loaded</span>
                {% endif %}
              </div>
              <p class="mono-large">{{ current }}</p>
            </div>

            {% if last_stats %}
            <div class="card">
              <h2>Last Request Performance</h2>
              <div class="stat-grid">
                <div class="stat">
                  <div class="value tps">{{ last_stats.tokens_per_second }}</div>
                  <div class="label">tokens/sec</div>
                </div>
                <div class="stat">
                  <div class="value">{{ last_stats.completion_tokens }}</div>
                  <div class="label">completion tokens</div>
                </div>
                <div class="stat">
                  <div class="value">{{ last_stats.total_time }}s</div>
                  <div class="label">total time</div>
                </div>
              </div>
            </div>
            {% endif %}

            {% if models %}
            <div class="card">
              <h2>Load Existing Model</h2>
              <form method="post" action="/load-model" class="row">
                <select name="model_name">
                  {% for m in models %}
                  <option value="{{ m }}" {% if m == current %}selected{% endif %}>{{ m }}</option>
                  {% endfor %}
                </select>
                <button type="submit">Load</button>
              </form>
            </div>
            {% endif %}

            <div class="card">
              <h2>Download from Hugging Face (Manual)</h2>
              <form method="post" action="/download-model">
                <label>Repository ID</label>
                <input type="text" name="repo_id" placeholder="TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF" required>
                <label>Filename</label>
                <input type="text" name="filename" placeholder="tinyllama-1.1b-chat-v1.0.Q8_0.gguf" required>
                <button type="submit">Download</button>
              </form>
            </div>

            <div class="card">
              <h2>API Access</h2>
              <label>Base URL</label>
              <div class="input-group">
                <input type="text" id="baseUrl" value="{{ base_url }}/v1" readonly class="mono">
                <button type="button" class="btn-secondary" onclick="copyText('baseUrl', this)">Copy</button>
              </div>
              <label>API Key</label>
              <div class="input-group">
                <input type="text" id="apiKey" value="{{ api_key }}" readonly class="mono">
                <button type="button" class="btn-secondary" onclick="copyText('apiKey', this)">Copy</button>
              </div>
              <form method="post" action="/regenerate-api-key" style="margin-top: 0.5rem;">
                <button type="submit" class="btn-secondary"
                        onclick="return confirm('Regenerate API key? The old key will stop working immediately.')">
                  Regenerate API Key
                </button>
              </form>
              <p class="hint">
                Use in any OpenAI SDK: <code>base_url="{{ base_url }}/v1"</code> + <code>api_key="sk-…"</code>
              </p>
            </div>
          </div>

          <script>
            function copyText(id, btn) {
              const input = document.getElementById(id);
              navigator.clipboard.writeText(input.value).then(() => {
                const orig = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = orig, 1500);
              });
            }
          </script>
          {% endblock %}
          HTMLEOF

          # ---------- store.html ----------
          cat > proxy/templates/store.html << 'HTMLEOF'
          {% extends "base.html" %}
          {% block title %}Model Store{% endblock %}
          {% block body %}
          <div class="container">
            <div class="header">
              <div class="logo">🚀 <span>LLM Proxy</span></div>
              <div class="row">
                <a href="/" class="nav-link">Dashboard</a>
                <a href="/store" class="nav-link active">Model Store</a>
                <span class="muted" style="margin: 0;">{{ user }}</span>
                <a href="/logout" class="btn btn-secondary">Logout</a>
              </div>
            </div>

            <div class="card">
              <h2>Discover Models</h2>
              <p class="muted">Browse single-file GGUF models from Hugging Face. Vision models with embedded projectors are supported.</p>
              <form method="get" action="/store" class="row" style="margin-bottom: 1rem;">
                <input type="text" name="search" value="{{ search }}" placeholder="Search model name..." style="margin-bottom: 0;">
                <label style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0; text-transform: none; font-size: 0.9rem;">
                  <input type="checkbox" name="vision_only" value="true" {% if vision_only %}checked{% endif %}>
                  Vision only
                </label>
                <button type="submit">Search</button>
              </form>
            </div>

            {% if models %}
            <div class="card">
              <h2>Results ({{ models|length }})</h2>
              {% for m in models %}
              <div class="model-item">
                <div class="model-info">
                  <div class="model-name">{{ m.id }}</div>
                  <div class="model-meta">
                    {{ m.filename }} · {{ m.downloads }} downloads
                    {% if m.is_vision %}<span class="badge vision" style="margin-left: 0.5rem;">Vision</span>{% endif %}
                  </div>
                </div>
                <div class="model-actions">
                  <form method="post" action="/store/download" style="display: inline;">
                    <input type="hidden" name="repo_id" value="{{ m.id }}">
                    <input type="hidden" name="filename" value="{{ m.filename }}">
                    <button type="submit" class="btn-secondary">Download</button>
                  </form>
                </div>
              </div>
              {% endfor %}
            </div>
            {% else %}
            <div class="card">
              <p class="muted">No models found. Try adjusting your search or filters.</p>
            </div>
            {% endif %}
          </div>
          {% endblock %}
          HTMLEOF

      - name: Start Custom Proxy (with extended health check)
        run: |
          cd proxy
          nohup python -u -m uvicorn main:app --host 127.0.0.1 --port 8000 > proxy.log 2>&1 &
          echo $! > proxy.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "✅ Proxy is up after ${i}s"
              break
            fi
            sleep 1
          done
          echo "=== /health ===" && curl -s http://127.0.0.1:8000/health
          echo ""
          echo "=== /setup ===" && curl -s -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:8000/setup
          echo ""
          echo "=== proxy.log (tail) ===" && tail -20 proxy/proxy.log || true

      - name: Fail job if /setup not 200
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/setup || echo "000")
          echo "GET /setup → HTTP $code"
          if [ "$code" != "200" ]; then
            echo "❌ /setup not returning 200. Full proxy.log:"
            cat proxy/proxy.log
            exit 1
          fi

      - name: Dump proxy log on failure
        if: failure()
        run: |
          echo "=== proxy.log ===" && cat proxy/proxy.log 2>/dev/null || true
          echo "=== ps ===" && ps aux | grep -E "uvicorn|python" | grep -v grep || true

      - name: Expose via Cloudflare Tunnel
        run: |
          cloudflared tunnel --url http://127.0.0.1:8000 --no-autoupdate
