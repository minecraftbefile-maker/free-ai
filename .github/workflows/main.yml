          # ---------- dashboard.html ----------
          cat > proxy/templates/dashboard.html << 'HTMLEOF'
          {% extends "base.html" %}
          {% block title %}Dashboard{% endblock %}
          {% block body %}
          <div class="container">
            <div class="header">
              <div class="logo">🚀 <span>LLM Proxy</span></div>
              <div class="row">
                <a href="/" class="nav-link active">Dashboard</a>
                <a href="/store" class="nav-link">Model Store</a>
                <span class="muted" style="margin: 0;">{{ user }}</span>
                <a href="/logout" class="btn btn-secondary">Logout</a>
              </div>
            </div>

            {% if error %}<div class="error">{{ error }}</div>{% endif %}

            <div class="card">
              <div class="card-header">
                <h2>Current Model</h2>
                {% if current == "None" %}
                  <span class="badge notloaded">no model loaded</span>
                {% else %}
                  <span class="badge loaded">● loaded</span>
                {% endif %}
              </div>
              <p class="mono-large">{{ current }}</p>
            </div>

            {% if last_stats %}
            <div class="card">
              <h2>Last Request Performance</h2>
              <div class="stat-grid">
                <div class="stat">
                  <div class="value tps">{{ last_stats.tokens_per_second }}</div>
                  <div class="label">tokens/sec</div>
                </div>
                <div class="stat">
                  <div class="value">{{ last_stats.completion_tokens }}</div>
                  <div class="label">completion tokens</div>
                </div>
                <div class="stat">
                  <div class="value">{{ last_stats.total_time }}s</div>
                  <div class="label">total time</div>
                </div>
              </div>
            </div>
            {% endif %}

            {% if models %}
            <div class="card">
              <h2>Load Existing Model</h2>
              <form id="loadModelForm" class="row">
                <select name="model_name" id="modelSelect">
                  {% for m in models %}
                  <option value="{{ m }}" {% if m == current %}selected{% endif %}>{{ m }}</option>
                  {% endfor %}
                </select>
                <button type="submit">Load</button>
              </form>
            </div>
            <script>
              document.getElementById('loadModelForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const modelName = document.getElementById('modelSelect').value;
                showLoading(`Loading ${modelName} into memory...`);
                try {
                  const res = await fetch('/api/load-model', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model_name: modelName })
                  });
                  const data = await res.json();
                  if (!res.ok) throw new Error(data.error || 'Failed to load');
                  window.location.reload();
                } catch (err) {
                  alert(err.message);
                  hideLoading();
                }
              });
            </script>
            {% endif %}

            <div class="card">
              <h2>Download from Hugging Face (Manual)</h2>
              <form id="manualDownloadForm">
                <label>Repository ID</label>
                <input type="text" id="repoId" placeholder="TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF" required>
                <label>Filename</label>
                <input type="text" id="fileName" placeholder="tinyllama-1.1b-chat-v1.0.Q8_0.gguf" required>
                <button type="submit">Download</button>
              </form>
            </div>
            <script>
              document.getElementById('manualDownloadForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const repoId = document.getElementById('repoId').value;
                const fileName = document.getElementById('fileName').value;
                showLoading(`Downloading ${fileName}...<br><small>This may take a few minutes depending on size.</small>`);
                try {
                  const res = await fetch('/api/download-model', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ repo_id: repoId, filename: fileName })
                  });
                  const data = await res.json();
                  if (!res.ok) throw new Error(data.error || 'Failed to download');
                  window.location.reload();
                } catch (err) {
                  alert(err.message);
                  hideLoading();
                }
              });
            </script>

            <div class="card">
              <h2>API Access</h2>
              <label>Base URL</label>
              <div class="input-group">
                <input type="text" id="baseUrl" value="{{ base_url }}/v1" readonly class="mono">
                <button type="button" class="btn-secondary" onclick="copyText('baseUrl', this)">Copy</button>
              </div>
              <label>API Key</label>
              <div class="input-group">
                <!-- API key is masked by default using type="password" -->
                <input type="password" id="apiKey" value="{{ api_key }}" readonly class="mono">
                <button type="button" class="btn-secondary" onclick="togglePassword('apiKey', this)">Show</button>
                <button type="button" class="btn-secondary" onclick="copyText('apiKey', this)">Copy</button>
              </div>
              <form method="post" action="/regenerate-api-key" style="margin-top: 0.5rem;">
                <button type="submit" class="btn-secondary"
                        onclick="return confirm('Regenerate API key? The old key will stop working immediately.')">
                  Regenerate API Key
                </button>
              </form>
            </div>
          </div>
          {% endblock %}
          HTMLEOF

          # ---------- store.html ----------
          cat > proxy/templates/store.html << 'HTMLEOF'
          {% extends "base.html" %}
          {% block title %}Model Store{% endblock %}
          {% block body %}
          <div class="container">
            <div class="header">
              <div class="logo">🚀 <span>LLM Proxy</span></div>
              <div class="row">
                <a href="/" class="nav-link">Dashboard</a>
                <a href="/store" class="nav-link active">Model Store</a>
                <span class="muted" style="margin: 0;">{{ user }}</span>
                <a href="/logout" class="btn btn-secondary">Logout</a>
              </div>
            </div>

            <div class="card">
              <h2>Discover Models</h2>
              <p class="muted">Search Hugging Face for GGUF models.</p>
              <form id="searchForm" class="row" style="margin-bottom: 1rem;">
                <input type="text" id="searchInput" placeholder="Search model name (e.g. llama, mistral)..." style="margin-bottom: 0;">
                <label style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0; text-transform: none; font-size: 0.9rem;">
                  <input type="checkbox" id="visionOnly">
                  Vision only
                </label>
                <button type="submit">Search</button>
              </form>
            </div>

            <div id="resultsContainer" class="card" style="display: none;">
              <h2>Results</h2>
              <div id="resultsList"></div>
            </div>
            
            <div id="emptyState" class="card" style="display: none;">
              <p class="muted">No models found. Try adjusting your search or filters.</p>
            </div>
          </div>

          <script>
            document.getElementById('searchForm').addEventListener('submit', async (e) => {
              e.preventDefault();
              const q = document.getElementById('searchInput').value;
              const visionOnly = document.getElementById('visionOnly').checked;
              
              document.getElementById('resultsContainer').style.display = 'none';
              document.getElementById('emptyState').style.display = 'none';
              showLoading('Searching Hugging Face...');
              
              try {
                const res = await fetch(`/api/store/search?q=${encodeURIComponent(q)}&vision_only=${visionOnly}`);
                const models = await res.json();
                hideLoading();
                
                if (!res.ok) throw new Error(models.error || 'Search failed');
                
                const list = document.getElementById('resultsList');
                list.innerHTML = '';
                
                if (models.length === 0) {
                  document.getElementById('emptyState').style.display = 'block';
                  return;
                }

                models.forEach(m => {
                  const item = document.createElement('div');
                  item.className = 'model-item';
                  // Safely format the ID for the DOM
                  const safeId = m.id.replace(/[^a-zA-Z0-9]/g, '_');
                  item.innerHTML = `
                    <div class="model-info">
                      <div class="model-name">${m.id} ${m.is_vision ? '<span class="badge vision">Vision</span>' : ''}</div>
                      <div class="model-meta">${m.downloads} downloads</div>
                    </div>
                    <div class="model-actions" id="actions_${safeId}">
                      <button class="btn-secondary" onclick="fetchFiles('${m.id}', this)">Get Files</button>
                    </div>
                  `;
                  list.appendChild(item);
                });
                
                document.getElementById('resultsContainer').style.display = 'block';
              } catch (err) {
                hideLoading();
                alert(err.message);
              }
            });

            async function fetchFiles(repoId, btn) {
              btn.innerText = 'Fetching...';
              btn.disabled = true;
              try {
                const res = await fetch(`/api/store/files?repo_id=${encodeURIComponent(repoId)}`);
                const data = await res.json();
                
                if (!res.ok) throw new Error(data.error || 'Failed to get files');
                if (data.error) throw new Error(data.error);
                
                // Create a dropdown of all files
                const selectId = 'select_' + repoId.replace(/[^a-zA-Z0-9]/g, '_');
                let options = data.files.map(f => `<option value="${f}">${f}</option>`).join('');
                
                btn.parentElement.innerHTML = `
                  <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; justify-content: flex-end;">
                    <select id="${selectId}" style="margin-bottom: 0; padding: 0.4rem; max-width: 250px; font-size: 0.8rem;">
                      ${options}
                    </select>
                    <button onclick="downloadSelected('${repoId}', '${selectId}', this)">Download</button>
                  </div>
                `;
              } catch (err) {
                btn.innerText = 'Get Files';
                btn.disabled = false;
                alert(err.message);
              }
            }

            function downloadSelected(repoId, selectId, btn) {
              const select = document.getElementById(selectId);
              const filename = select.value;
              downloadFile(repoId, filename, btn);
            }

            async function downloadFile(repoId, filename, btn) {
              showLoading(`Downloading ${filename}...<br><small>This might take a few minutes depending on size.</small>`);
              try {
                const res = await fetch('/api/download-model', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ repo_id: repoId, filename: filename })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Download failed');
                window.location.href = '/';
              } catch (err) {
                hideLoading();
                alert(err.message);
              }
            }
          </script>
          {% endblock %}
          HTMLEOF

      - name: Start Custom Proxy
        run: |
          cd proxy
          nohup python -u -m uvicorn main:app --host 127.0.0.1 --port 8000 > proxy.log 2>&1 &
          echo $! > proxy.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "✅ Proxy is up after ${i}s"
              break
            fi
            sleep 1
          done
          echo "=== /health ===" && curl -s http://127.0.0.1:8000/health
          echo ""
          echo "=== /setup ===" && curl -s -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:8000/setup
          echo ""
          echo "=== proxy.log (tail) ===" && tail -20 proxy/proxy.log || true

      - name: Fail job if /setup not 200
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/setup || echo "000")
          echo "GET /setup → HTTP $code"
          if [ "$code" != "200" ]; then
            echo "❌ /setup not returning 200. Full proxy.log:"
            cat proxy/proxy.log
            exit 1
          fi

      - name: Expose via Cloudflare Tunnel
        run: |
          cloudflared tunnel --url http://127.0.0.1:8000 --no-autoupdate
