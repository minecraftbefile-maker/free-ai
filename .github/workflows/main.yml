              <div class="input-group">
                <input type="text" id="baseUrl" value="{{ base_url }}/v1" readonly class="mono">
                <button type="button" class="btn-secondary" onclick="copyText(document.getElementById('baseUrl').value, this)">Copy</button>
              </div>
              <p class="hint">Go to the <a href="/keys" style="color: var(--primary);">API Keys</a> tab to generate and manage your access tokens.</p>
            </div>
          </div>
          {% endblock %}
