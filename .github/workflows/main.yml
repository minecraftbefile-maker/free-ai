          {% extends "base.html" %}
          {% block body %}
          <div class="container">
            <div class="header">
              <div class="logo">AI Suite</div>
              <div class="row">
                <a href="/" class="nav-link">Dashboard</a>
                <a href="/playground" class="nav-link active">Playground</a>
                <a href="/keys" class="nav-link">API Keys</a>
                <a href="/store" class="nav-link">Store</a>
                <span class="muted" style="margin-left: 1rem;">{{ user }}</span>
                <a href="/logout" class="btn-secondary">Logout</a>
              </div>
            </div>

            <div class="card" style="display: flex; flex-direction: column; height: 75vh;">
              <div class="row" style="margin-bottom: 1rem;">
                <select id="modelSelect" style="margin: 0;">
                  {% for m in loaded_models %}
                  <option value="{{ m }}">{{ m }}</option>
                  {% else %}
                  <option value="">No models loaded</option>
                  {% endfor %}
                </select>
              </div>

              <details style="margin-bottom: 1rem;">
                <summary style="cursor: pointer; color: var(--text-muted); font-size: 0.9rem;">Settings</summary>
                <div style="margin-top: 0.5rem; padding: 0.5rem; background: var(--bg); border: 1px solid var(--border); border-radius: 4px;">
                  <label>System Prompt</label>
                  <textarea id="systemPrompt" rows="2">You are a helpful assistant.</textarea>
                  <div class="row">
                    <div style="flex: 1;">
                      <label>Think Effort</label>
                      <select id="thinkEffort">
                        <option value="none">None (Direct)</option>
                        <option value="auto" selected>Auto (Model Default)</option>
                        <option value="high">High (Deep Reasoning)</option>
                      </select>
                    </div>
                    <div style="flex: 1;">
                      <label>Temp</label>
                      <input type="number" id="tempInput" value="0.7" step="0.1" min="0" max="2">
                    </div>
                    <div style="flex: 1;">
                      <label>Max Tokens</label>
                      <input type="number" id="maxTokensInput" value="1024" step="128" min="1">
                    </div>
                  </div>
                </div>
              </details>
              
              <div id="chatBox" style="flex: 1; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px; padding: 1rem; margin-bottom: 1rem; background: #000;">
                <div class="muted" style="text-align: center; margin-top: 2rem;">Start a conversation...</div>
              </div>

              <form id="chatForm" class="row">
                <input type="text" id="chatInput" placeholder="Type a message..." style="flex: 1; margin: 0;" required {% if not loaded_models %}disabled{% endif %}>
                <button type="submit" id="sendBtn" {% if not loaded_models %}disabled{% endif %}>Send</button>
                <button type="button" id="stopBtn" class="btn-danger" style="display: none;">Stop</button>
              </form>
            </div>
          </div>

          <script>
            const chatBox = document.getElementById('chatBox');
            const chatForm = document.getElementById('chatForm');
            const chatInput = document.getElementById('chatInput');
            const modelSelect = document.getElementById('modelSelect');
            const systemPromptInput = document.getElementById('systemPrompt');
            const thinkEffortInput = document.getElementById('thinkEffort');
            const tempInput = document.getElementById('tempInput');
            const maxTokensInput = document.getElementById('maxTokensInput');
            const sendBtn = document.getElementById('sendBtn');
            const stopBtn = document.getElementById('stopBtn');
            
            let history = [];
            let abortController = null;

            function appendMessage(role, text) {
              const div = document.createElement('div');
              div.style.marginBottom = '1rem';
              div.style.paddingBottom = '1rem';
              div.style.borderBottom = '1px solid var(--border)';
              div.innerHTML = `<strong>${role === 'user' ? 'User' : 'Assistant'}:</strong><br>${text}`;
              chatBox.appendChild(div);
              chatBox.scrollTop = chatBox.scrollHeight;
              return div;
            }

            stopBtn.addEventListener('click', () => {
              if (abortController) abortController.abort();
            });

            chatForm.addEventListener('submit', async (e) => {
              e.preventDefault();
              const text = chatInput.value;
              chatInput.value = '';
              appendMessage('user', text);
              history.push({ role: 'user', content: text });

              const aiDiv = appendMessage('assistant', '...');
              
              let sysPrompt = systemPromptInput.value.trim();
              let effort = thinkEffortInput.value;
              
              if (effort === 'none') sysPrompt = "Answer directly and concisely. Do not output any internal thinking process or use  tags. " + sysPrompt;
              else if (effort === 'high') sysPrompt = "Think deeply about this problem before answering. Wrap your internal monologue in  and  tags. " + sysPrompt;

              let messagesToSend = sysPrompt ? [{ role: 'system', content: sysPrompt }, ...history] : history;
              let temp = parseFloat(tempInput.value) || 0.7;
              let maxTokens = parseInt(maxTokensInput.value) || 1024;

              abortController = new AbortController();
              const signal = abortController.signal;

              sendBtn.disabled = true;
              stopBtn.style.display = 'inline-block';

              try {
                const res = await fetch('/v1/chat/completions', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    model: modelSelect.value,
                    messages: messagesToSend,
                    stream: true,
                    temperature: temp,
                    max_tokens: maxTokens
                  }),
                  signal: signal
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let aiText = '';

                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  const chunk = decoder.decode(value);
                  const lines = chunk.split('\n');
                  
                  for (const line of lines) {
                    if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                      try {
                        const data = JSON.parse(line.slice(6));
                        if (data.choices && data.choices[0].delta) {
                          const delta = data.choices[0].delta;
                          
                          if (delta.content) aiText += delta.content;
                          if (delta.tool_calls) aiText += `\n\nTool Call:\n\`\`\`json\n${JSON.stringify(delta.tool_calls, null, 2)}\n\`\`\`\n`;
                          
                          let thinkingHtml = "";
                          let cleanText = aiText;
                          
                          cleanText = cleanText.replace(/<think>([\s\S]*?)<\/think>/g, (match, p1) => {
                              thinkingHtml += `<details style="margin-bottom: 0.5rem; font-size: 0.9em; color: #8b949e;"><summary style="cursor: pointer;">Thinking Process</summary><div style="padding-left: 1rem; border-left: 2px solid #30363d; margin-top: 0.5rem;">${p1.trim()}</div></details>`;
                              return "";
                          });
                          
                          cleanText = cleanText.replace(/<think>([\s\S]*)$/, (match, p1) => {
                              thinkingHtml += `<details open style="margin-bottom: 0.5rem; font-size: 0.9em; color: #8b949e;"><summary style="cursor: pointer;">Thinking Process...</summary><div style="padding-left: 1rem; border-left: 2px solid #30363d; margin-top: 0.5rem;">${p1.trim()}</div></details>`;
                              return "";
                          });

                          aiDiv.innerHTML = `<strong>Assistant:</strong><br>${thinkingHtml}<div class="markdown-body">${marked.parse(cleanText)}</div>`;
                          chatBox.scrollTop = chatBox.scrollHeight;
                        }
                      } catch (err) {}
                    }
                  }
                }
                history.push({ role: 'assistant', content: aiText });
              } catch (err) {
                if (err.name === 'AbortError') {
                  aiDiv.innerHTML += `<br><span class="muted" style="font-size: 0.85rem;">(Stopped)</span>`;
                } else {
                  aiDiv.innerHTML = `<strong>Assistant:</strong> <span style="color: var(--error)">Error: ${err.message}</span>`;
                }
              } finally {
                sendBtn.disabled = false;
                stopBtn.style.display = 'none';
                abortController = null;
              }
            });
          </script>
          {% endblock %}
          HTMLEOF

