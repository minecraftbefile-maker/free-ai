          # ---------- image.html ----------
          cat > proxy/templates/image.html << 'HTMLEOF'
          {% extends "base.html" %}
          {% block body %}
          <div class="container">
            <div class="header">
              <div class="logo">🚀 <span>AI Suite</span></div>
              <div class="row">
                <a href="/" class="nav-link">Dashboard</a>
                <a href="/image" class="nav-link active">Image Gen</a>
                <a href="/keys" class="nav-link">API Keys</a>
                <a href="/store" class="nav-link">Store</a>
                <span class="muted" style="margin: 0;">{{ user }}</span>
                <a href="/logout" class="btn btn-secondary">Logout</a>
              </div>
            </div>

            <div class="card">
              <h2>Generate Image</h2>
              <p class="muted" style="margin-bottom: 1rem;">
                {% if current_model %}
                  Using: <strong>{{ current_model.name }}</strong>
                {% else %}
                  No model selected. Please go to the <a href="/store" style="color: var(--primary);">Store</a> to download one.
                {% endif %}
              </p>
              
              <form id="imageForm" {% if not current_model %}style="opacity: 0.5; pointer-events: none;"{% endif %}>
                <label>Prompt</label>
                <input type="text" id="prompt" placeholder="A futuristic city, cyberpunk style" required>
                <div class="row" style="margin-bottom: 1rem;">
                  <div style="flex: 1;">
                    <label>Width</label>
                    <select id="width">
                      <option value="512">512</option>
                      <option value="256">256</option>
                    </select>
                  </div>
                  <div style="flex: 1;">
                    <label>Height</label>
                    <select id="height">
                      <option value="512">512</option>
                      <option value="256">256</option>
                    </select>
                  </div>
                  <div style="flex: 1;">
                    <label>Steps</label>
                    <input type="number" id="steps" value="{{ current_model.steps if current_model else 4 }}" min="1" max="10">
                  </div>
                </div>
                <button type="submit" style="width: 100%;">Generate</button>
              </form>
            </div>

            <div id="resultContainer" class="card" style="display: none; text-align: center;">
              <h2>Result</h2>
              <img id="resultImage" style="max-width: 100%; border-radius: 8px; margin-top: 1rem;">
            </div>
          </div>

          <script>
            document.getElementById('imageForm').addEventListener('submit', async (e) => {
              e.preventDefault();
              showLoading('Generating image...<br><small>This takes ~30-60s on CPU.</small>');
              
              try {
                const res = await fetch('/v1/images/generations', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    prompt: document.getElementById('prompt').value,
                    width: parseInt(document.getElementById('width').value),
                    height: parseInt(document.getElementById('height').value),
                    steps: parseInt(document.getElementById('steps').value)
                  })
                });
                
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Generation failed');
                
                document.getElementById('resultImage').src = `data:image/png;base64,${data.data[0].b64_json}`;
                document.getElementById('resultContainer').style.display = 'block';
                hideLoading();
              } catch (err) {
                alert(err.message);
                hideLoading();
              }
            });
          </script>
          {% endblock %}
          HTMLEOF

          # ---------- keys.html ----------
          cat > proxy/templates/keys.html << 'HTMLEOF'
          {% extends "base.html" %}
          {% block body %}
          <div class="container">
            <div class="header">
              <div class="logo">🚀 <span>AI Suite</span></div>
              <div class="row">
                <a href="/" class="nav-link">Dashboard</a>
                <a href="/image" class="nav-link">Image Gen</a>
                <a href="/keys" class="nav-link active">API Keys</a>
                <a href="/store" class="nav-link">Store</a>
                <span class="muted" style="margin: 0;">{{ user }}</span>
                <a href="/logout" class="btn btn-secondary">Logout</a>
              </div>
            </div>

            <div class="card">
              <h2>Create New Key</h2>
              <form id="createKeyForm">
                <div class="row" style="margin-bottom: 1rem;">
                  <div style="flex: 2;">
                    <label>Key Name</label>
                    <input type="text" id="keyName" placeholder="e.g. App Key" required>
                  </div>
                  <div style="flex: 1;">
                    <label>Expires (Days)</label>
                    <input type="number" id="keyExpiry" placeholder="0 = Never" value="0">
                  </div>
                  <div style="flex: 1;">
                    <label>Max Requests</label>
                    <input type="number" id="keyReqLimit" placeholder="0 = ∞" value="0">
                  </div>
                  <div style="flex: 1;">
                    <label>Max Tokens</label>
                    <input type="number" id="keyTokLimit" placeholder="0 = ∞" value="0">
                  </div>
                </div>
                <button type="submit">Generate Key</button>
              </form>
              <div id="newKeyDisplay" style="display: none; margin-top: 1rem; padding: 1rem; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 8px;">
                <p style="margin-bottom: 0.5rem; color: var(--success); font-weight: 600;">Key Generated Successfully!</p>
                <div class="input-group">
                  <input type="text" id="generatedKey" readonly class="mono">
                  <button type="button" onclick="copyText(document.getElementById('generatedKey').value, this)">Copy</button>
                </div>
              </div>
            </div>

            <div class="card">
              <h2>Existing Keys</h2>
              <table style="width: 100%; border-collapse: collapse; margin-top: 1rem;">
                <thead>
                  <tr>
                    <th style="text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border);">Name</th>
                    <th style="text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border);">Key</th>
                    <th style="text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border);">Usage (Req / Tokens)</th>
                    <th style="text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border);">Expires</th>
                    <th style="text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border);">Status</th>
                    <th style="text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border);">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {% for k in keys %}
                  <tr>
                    <td style="padding: 0.75rem; border-bottom: 1px solid var(--border);">{{ k.name }}</td>
                    <td style="padding: 0.75rem; border-bottom: 1px solid var(--border);"><code class="mono">{{ k.masked }}</code></td>
                    <td style="padding: 0.75rem; border-bottom: 1px solid var(--border);">
                      {{ k.requests_used }} / {{ '∞' if k.max_requests == 0 else k.max_requests }} req<br>
                      {{ k.tokens_used }} / {{ '∞' if k.max_tokens == 0 else k.max_tokens }} tok
                    </td>
                    <td style="padding: 0.75rem; border-bottom: 1px solid var(--border);">{{ k.expires_str }}</td>
                    <td style="padding: 0.75rem; border-bottom: 1px solid var(--border);">
                      <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.5rem; background: {{ 'var(--success)' if k.active else 'var(--error)' }};"></span>
                      {{ 'Active' if k.active else 'Revoked' }}
                    </td>
                    <td style="padding: 0.75rem; border-bottom: 1px solid var(--border);">
                      <button class="btn-secondary" style="padding: 0.3rem 0.6rem; font-size: 0.75rem;" onclick="toggleKey('{{ k.id }}')">
                        {{ 'Disable' if k.active else 'Enable' }}
                      </button>
                      <button class="btn-danger" style="padding: 0.3rem 0.6rem; font-size: 0.75rem;" onclick="deleteKey('{{ k.id }}')">
                        Delete
                      </button>
                    </td>
                  </tr>
                  {% endfor %}
                </tbody>
              </table>
            </div>
          </div>

          <script>
            document.getElementById('createKeyForm').addEventListener('submit', async (e) => {
              e.preventDefault();
              showLoading('Generating key...');
              const res = await fetch('/api/keys', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  name: document.getElementById('keyName').value,
                  expires_days: document.getElementById('keyExpiry').value,
                  max_req: document.getElementById('keyReqLimit').value,
                  max_tok: document.getElementById('keyTokLimit').value
                })
              });
              if (res.ok) {
                const data = await res.json();
                document.getElementById('newKeyDisplay').style.display = 'block';
                document.getElementById('generatedKey').value = data.key;
                document.getElementById('createKeyForm').reset();
                hideLoading();
                setTimeout(() => window.location.reload(), 10000);
              } else {
                alert('Failed to create key.'); hideLoading();
              }
            });

            async function toggleKey(id) {
              await fetch(`/api/keys/${id}/toggle`, { method: 'PUT' });
              window.location.reload();
            }

            async function deleteKey(id) {
              if (confirm('Delete this key permanently?')) {
                await fetch(`/api/keys/${id}`, { method: 'DELETE' });
                window.location.reload();
              }
            }
          </script>
          {% endblock %}
          HTMLEOF

          # ---------- store.html ----------
          cat > proxy/templates/store.html << 'HTMLEOF'
          {% extends "base.html" %}
          {% block body %}
          <div class="container">
            <div class="header">
              <div class="logo">🚀 <span>AI Suite</span></div>
              <div class="row">
                <a href="/" class="nav-link">Dashboard</a>
                <a href="/image" class="nav-link">Image Gen</a>
                <a href="/keys" class="nav-link">API Keys</a>
                <a href="/store" class="nav-link active">Store</a>
                <span class="muted" style="margin: 0;">{{ user }}</span>
                <a href="/logout" class="btn btn-secondary">Logout</a>
              </div>
            </div>

            <div class="card">
              <h2>Discover Models</h2>
              <div class="row" style="margin-bottom: 1rem;">
                <select id="modelType" style="width: auto; margin: 0;">
                  <option value="text">Text Models (< 9B)</option>
                  <option value="image">Image Models</option>
                </select>
                <input type="text" id="searchInput" placeholder="Search model name..." style="margin: 0; flex: 1;">
                <button id="searchBtn" style="margin: 0;">Search</button>
              </div>
            </div>

            <div id="resultsContainer" class="card" style="display: none;">
              <h2>Results</h2>
              <div id="resultsList"></div>
            </div>
          </div>

          <script>
            async function searchModels() {
              const q = document.getElementById('searchInput').value;
              const type = document.getElementById('modelType').value;
              
              showLoading('Searching...');
              const url = `/api/store/search?q=${encodeURIComponent(q)}&model_type=${type}`;
              const res = await fetch(url);
              const models = await res.json();
              hideLoading();
              
              const list = document.getElementById('resultsList');
              list.innerHTML = models.length ? '' : '<p class="muted">No models found.</p>';
              
              if (type === 'image') {
                models.forEach(m => {
                  list.innerHTML += `
                    <div class="row" style="border-bottom: 1px solid var(--border); padding: 0.75rem 0;">
                      <div style="flex: 1;">
                        <div style="font-weight: 600;">${m.name}</div>
                        <div class="muted">Repo: ${m.id}</div>
                      </div>
                      <div>
                        <button class="btn-secondary" onclick="selectImageModel('${m.id}')">Select</button>
                      </div>
                    </div>
                  `;
                });
              } else {
                models.forEach(m => {
                  const safeId = m.id.replace(/[^a-zA-Z0-9]/g, '_');
                  list.innerHTML += `
                    <div class="row" style="border-bottom: 1px solid var(--border); padding: 0.75rem 0;">
                      <div style="flex: 1;">
                        <div style="font-weight: 600;">${m.id} ${m.is_vision ? '<span class="badge loaded">Vision</span>' : ''}</div>
                        <div class="muted">${m.downloads} downloads</div>
                      </div>
                      <div id="actions_${safeId}">
                        <button class="btn-secondary" onclick="fetchFiles('${m.id}', this)">Get Files</button>
                      </div>
                    </div>
                  `;
                });
              }
              document.getElementById('resultsContainer').style.display = 'block';
            }

            document.getElementById('searchBtn').addEventListener('click', searchModels);
            document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') searchModels(); });
            
            // Load initial popular models on page load
            window.onload = searchModels;

            async function selectImageModel(modelId) {
              showLoading('Downloading image model... This may take a minute.');
              const res = await fetch('/api/store/select-image-model', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model_id: modelId })
              });
              if (res.ok) {
                alert('Image model selected successfully!');
                window.location.href = '/image';
              } else {
                alert('Failed to select model.'); hideLoading();
              }
            }

            async function fetchFiles(repoId, btn) {
              btn.innerText = 'Fetching...';
              const res = await fetch(`/api/store/files?repo_id=${encodeURIComponent(repoId)}`);
              const data = await res.json();
              if (data.files.length === 0) { btn.innerText = 'No GGUF'; return; }
              
              const selectId = 'select_' + repoId.replace(/[^a-zA-Z0-9]/g, '_');
              let options = data.files.map(f => `<option value="${f}">${f}</option>`).join('');
              btn.parentElement.innerHTML = `
                <div class="row">
                  <select id="${selectId}" style="padding: 0.4rem; max-width: 200px; font-size: 0.8rem; margin: 0;">${options}</select>
                  <button onclick="downloadSelected('${repoId}', '${selectId}')">Download</button>
                </div>
              `;
            }

            async function downloadSelected(repoId, selectId) {
              const filename = document.getElementById(selectId).value;
              showLoading(`Downloading ${filename}...<br><small>This may take a few minutes.</small>`);
              const res = await fetch('/api/download-model', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ repo_id: repoId, filename: filename })
              });
              if (res.ok) window.location.href = '/';
              else { alert('Download failed.'); hideLoading(); }
            }
          </script>
          {% endblock %}
          HTMLEOF

      - name: Start Custom Proxy
        run: |
          cd proxy
          nohup python -u -m uvicorn main:app --host 127.0.0.1 --port 8000 > proxy.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do
            if ! kill -0 $PID 2>/dev/null; then
              echo "❌ Uvicorn process died!"; cat proxy.log; exit 1
            fi
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "✅ Proxy is up after ${i}s"; break
            fi
            sleep 1
          done

      - name: Expose via Cloudflare Tunnel
        run: |
          cloudflared tunnel --url http://127.0.0.1:8000 --no-autoupdate
