                    <label>Max Tokens</label>
                    <input type="number" id="keyTokLimit" placeholder="0 = ∞" value="0">
                  </div>
                </div>
                <button type="submit">Generate</button>
              </form>
              <div id="newKeyDisplay" style="display: none; margin-top: 1rem; padding: 1rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg);">
                <p style="margin-bottom: 0.5rem; font-weight: 600;">Key Generated:</p>
                <div class="input-group">
                  <input type="text" id="generatedKey" readonly style="font-family: monospace;">
                  <button class="btn-secondary" onclick="copyText(document.getElementById('generatedKey').value, this)">Copy</button>
                </div>
              </div>
            </div>

            <div class="card">
              <h2>Existing Keys</h2>
              <table style="width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 14px;">
                <thead>
                  <tr>
                    <th style="text-align: left; padding: 0.5rem; border-bottom: 1px solid var(--border);">Name</th>
                    <th style="text-align: left; padding: 0.5rem; border-bottom: 1px solid var(--border);">Key</th>
                    <th style="text-align: left; padding: 0.5rem; border-bottom: 1px solid var(--border);">Usage</th>
                    <th style="text-align: left; padding: 0.5rem; border-bottom: 1px solid var(--border);">Expires</th>
                    <th style="text-align: left; padding: 0.5rem; border-bottom: 1px solid var(--border);">Status</th>
                    <th style="text-align: left; padding: 0.5rem; border-bottom: 1px solid var(--border);">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {% for k in keys %}
                  <tr>
                    <td style="padding: 0.5rem; border-bottom: 1px solid var(--border);">{{ k.name }}</td>
                    <td style="padding: 0.5rem; border-bottom: 1px solid var(--border); font-family: monospace; font-size: 12px;">{{ k.masked }}</td>
                    <td style="padding: 0.5rem; border-bottom: 1px solid var(--border);">
                      {{ k.requests_used }} / {{ '∞' if k.max_requests == 0 else k.max_requests }} req<br>
                      {{ k.tokens_used }} / {{ '∞' if k.max_tokens == 0 else k.max_tokens }} tok
                    </td>
                    <td style="padding: 0.5rem; border-bottom: 1px solid var(--border);">{{ k.expires_str }}</td>
                    <td style="padding: 0.5rem; border-bottom: 1px solid var(--border);">
                      <span class="badge" style="background: {{ 'var(--success)' if k.active else 'var(--error)' }}; color: white; border: none;">{{ 'Active' if k.active else 'Revoked' }}</span>
                    </td>
                    <td style="padding: 0.5rem; border-bottom: 1px solid var(--border);">
                      <button class="btn-secondary" style="padding: 0.2rem 0.4rem; font-size: 12px;" onclick="toggleKey('{{ k.id }}')">
                        {{ 'Disable' if k.active else 'Enable' }}
                      </button>
                      <button class="btn-danger" style="padding: 0.2rem 0.4rem; font-size: 12px;" onclick="deleteKey('{{ k.id }}')">
                        Delete
                      </button>
                    </td>
                  </tr>
                  {% endfor %}
                </tbody>
              </table>
            </div>
          </div>

          <script>
            document.getElementById('createKeyForm').addEventListener('submit', async (e) => {
              e.preventDefault();
              showLoading('Generating...');
              const res = await fetch('/api/keys', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  name: document.getElementById('keyName').value,
                  expires_days: document.getElementById('keyExpiry').value,
                  max_req: document.getElementById('keyReqLimit').value,
                  max_tok: document.getElementById('keyTokLimit').value
                })
              });
              if (res.ok) {
                const data = await res.json();
                document.getElementById('newKeyDisplay').style.display = 'block';
                document.getElementById('generatedKey').value = data.key;
                document.getElementById('createKeyForm').reset();
                hideLoading();
                setTimeout(() => window.location.reload(), 10000);
              } else {
                alert('Failed'); hideLoading();
              }
            });

            async function toggleKey(id) {
              await fetch(`/api/keys/${id}/toggle`, { method: 'PUT' });
              window.location.reload();
            }

            async function deleteKey(id) {
              if (confirm('Delete this key?')) {
                await fetch(`/api/keys/${id}`, { method: 'DELETE' });
                window.location.reload();
              }
            }
          </script>
          {% endblock %}
          HTMLEOF

          # ---------- store.html (updated to show big models for AirLLM) ----------
          cat > proxy/templates/store.html << 'HTMLEOF'
          {% extends "base.html" %}
          {% block body %}
          <div class="container">
            <div class="header">
              <div class="logo">AI Suite</div>
              <div class="row">
                <a href="/" class="nav-link">Dashboard</a>
                <a href="/playground" class="nav-link">Playground</a>
                <a href="/keys" class="nav-link">API Keys</a>
                <a href="/store" class="nav-link active">Store</a>
                <span class="muted" style="margin-left: 1rem;">{{ user }}</span>
                <a href="/logout" class="btn-secondary">Logout</a>
              </div>
            </div>

            <div class="card">
              <h2>Search Models</h2>
              <div class="row" style="margin-bottom: 1rem;">
                <input type="text" id="searchInput" placeholder="Search name..." style="margin: 0; flex: 1;">
                <button id="searchBtn" style="margin: 0;">Search</button>
              </div>
              <p class="muted" style="margin-bottom: 0;">
                <label style="display: inline-flex; align-items: center; gap: 0.5rem;">
                  <input type="checkbox" id="showBigModels" style="margin: 0;"> Show big models (suitable for AirLLM)
                </label>
              </p>
            </div>

            <div id="resultsContainer" class="card" style="display: none;">
              <h2>Results</h2>
              <div id="resultsList"></div>
            </div>
          </div>

          <script>
            async function searchModels() {
              const q = document.getElementById('searchInput').value;
              const big = document.getElementById('showBigModels').checked;
              showLoading('Searching...');
              const url = big ? `/api/store/search-big?q=${encodeURIComponent(q)}` : `/api/store/search?q=${encodeURIComponent(q)}`;
              const res = await fetch(url);
              const models = await res.json();
              hideLoading();
              
              const list = document.getElementById('resultsList');
              list.innerHTML = models.length ? '' : '<p class="muted">No models found.</p>';
              
              models.forEach(m => {
                const safeId = m.id.replace(/[^a-zA-Z0-9]/g, '_');
                const isBig = big; // if big search, we assume these are big models
                list.innerHTML += `
                  <div class="row" style="border-bottom: 1px solid var(--border); padding: 0.75rem 0;">
                    <div style="flex: 1;">
                      <div style="font-weight: 600;">${m.id} ${m.is_vision ? '<span class="badge">Vision</span>' : ''} ${isBig ? '<span class="badge">Big</span>' : ''}</div>
                      <div class="muted" style="font-size: 0.85rem;">${m.downloads} downloads</div>
                    </div>
                    <div id="actions_${safeId}">
                      ${big 
                        ? `<button class="btn-secondary" onclick="loadAirLLM('${m.id}')">Load via AirLLM</button>`
                        : `<button class="btn-secondary" onclick="fetchFiles('${m.id}', this)">Get Files</button>`
                      }
                    </div>
                  </div>
                `;
              });
              document.getElementById('resultsContainer').style.display = 'block';
            }

            document.getElementById('searchBtn').addEventListener('click', searchModels);
            document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') searchModels(); });
            window.onload = searchModels;

            async function fetchFiles(repoId, btn) {
              btn.innerText = 'Fetching...';
              const res = await fetch(`/api/store/files?repo_id=${encodeURIComponent(repoId)}`);
              const data = await res.json();
              if (data.files.length === 0) { btn.innerText = 'No GGUF'; return; }
              
              const selectId = 'select_' + repoId.replace(/[^a-zA-Z0-9]/g, '_');
              let options = data.files.map(f => `<option value="${f}">${f}</option>`).join('');
              btn.parentElement.innerHTML = `
                <div class="row">
                  <select id="${selectId}" style="padding: 0.4rem; margin: 0; font-size: 0.85rem;">${options}</select>
                  <button onclick="downloadSelected('${repoId}', '${selectId}')">Download</button>
                </div>
              `;
            }

            async function downloadSelected(repoId, selectId) {
              const filename = document.getElementById(selectId).value;
              showLoading(`Downloading...`);
              const res = await fetch('/api/download-model', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ repo_id: repoId, filename: filename })
              });
              if (res.ok) window.location.href = '/';
              else { alert('Download failed.'); hideLoading(); }
            }

            async function loadAirLLM(repoId) {
              if (!confirm(`Load "${repoId}" via AirLLM? This may take a long time as the model is sharded.`)) return;
              showLoading(`Loading ${repoId} via AirLLM (this may take a while)...`);
              const res = await fetch('/api/load-model', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model_name: repoId, runtime: 'airllm' })
              });
              if (res.ok) {
                window.location.href = '/';
              } else {
                const err = await res.json();
                alert(err.error || 'Failed to load AirLLM model.');
                hideLoading();
              }
            }
          </script>
          {% endblock %}
          HTMLEOF

      - name: Start Custom Proxy
        run: |
          cd proxy
          nohup python -u -m uvicorn main:app --host 127.0.0.1 --port 8000 > proxy.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do
            if ! kill -0 $PID 2>/dev/null; then
              echo "❌ Uvicorn process died!"; cat proxy.log; exit 1
            fi
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "✅ Proxy is up after ${i}s"; break
            fi
            sleep 1
          done

      - name: Expose via Cloudflare Tunnel
        run: |
          cloudflared tunnel --url http://127.0.0.1:8000 --no-autoupdate
