name: Custom‑Auth LLM Proxy (No PyTorch, No oobabooga)

on:
  workflow_dispatch:

jobs:
  deploy-custom-proxy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Add Swap Space (8G)
        run: |
          sudo fallocate -l 8G /mnt/large-swapfile
          sudo chmod 600 /mnt/large-swapfile
          sudo mkswap /mnt/large-swapfile
          sudo swapon /mnt/large-swapfile
          free -h

      - name: Install OpenBLAS (needed by llama-cpp)
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Install llama-cpp-python (CPU only) and dependencies
        run: |
          CMAKE_ARGS="-DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS -DGGML_CUDA=OFF"
          pip install llama-cpp-python[server] huggingface-hub fastapi uvicorn jinja2 python-multipart itsdangerous passlib[bcrypt]
          pip list | grep -i torch || echo "PyTorch is NOT installed (good)"

      - name: Verify llama_cpp imports correctly
        run: python -c "from llama_cpp import Llama; print('llama_cpp import OK')"

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Write Custom Proxy Application
        run: |
          mkdir -p proxy/templates proxy/data proxy/models
          cat > proxy/main.py << 'PYEOF'
          import os
          import json
          import uuid
          from pathlib import Path
          from typing import Optional

          from fastapi import FastAPI, Request, Form, Depends, HTTPException
          from fastapi.responses import HTMLResponse, RedirectResponse, JSONResponse
          from fastapi.templating import Jinja2Templates
          from starlette.middleware.sessions import SessionMiddleware
          from starlette.status import HTTP_303_SEE_OTHER
          from passlib.context import CryptContext
          from huggingface_hub import hf_hub_download

          from llama_cpp import Llama

          # ---------- Configuration (absolute paths!) ----------
          BASE_DIR = Path(__file__).parent.resolve()
          SECRET_KEY = "change-this-session-secret"
          CONFIG_FILE = BASE_DIR / "data" / "config.json"
          MODELS_DIR = BASE_DIR / "models"
          TEMPLATES_DIR = BASE_DIR / "templates"
          MODELS_DIR.mkdir(exist_ok=True)
          CONFIG_FILE.parent.mkdir(exist_ok=True)

          app = FastAPI()
          app.add_middleware(SessionMiddleware, secret_key=SECRET_KEY)
          templates = Jinja2Templates(directory=str(TEMPLATES_DIR))
          pwd_context = CryptContext(schemes=["bcrypt"], deprecated="auto")

          # ---------- Model Manager ----------
          class ModelManager:
              def __init__(self):
                  self.current_llm: Optional[Llama] = None
                  self.current_model_name: Optional[str] = None

              def load_model(self, model_path: str, model_name: str):
                  if self.current_llm is not None:
                      try:
                          self.current_llm.close()
                      except Exception:
                          pass
                      self.current_llm = None
                  self.current_llm = Llama(
                      model_path=model_path,
                      n_ctx=4096,
                      n_threads=os.cpu_count() or 4,
                      n_gpu_layers=0,
                      use_mlock=True,
                      verbose=False
                  )
                  self.current_model_name = model_name

              def generate(self, messages, max_tokens=512, temperature=0.7):
                  if self.current_llm is None:
                      raise RuntimeError("No model loaded")
                  return self.current_llm.create_chat_completion(
                      messages=messages,
                      max_tokens=max_tokens,
                      temperature=temperature
                  )

          manager = ModelManager()

          # ---------- Auth Helpers ----------
          def load_config():
              if CONFIG_FILE.exists():
                  return json.loads(CONFIG_FILE.read_text())
              return {}

          def save_config(cfg):
              CONFIG_FILE.parent.mkdir(parents=True, exist_ok=True)
              CONFIG_FILE.write_text(json.dumps(cfg))

          def is_password_set():
              return "password_hash" in load_config()

          def verify_password(password: str) -> bool:
              cfg = load_config()
              return pwd_context.verify(password, cfg.get("password_hash", ""))

          def get_user(request: Request):
              user = request.session.get("user")
              if not user:
                  raise HTTPException(status_code=303, headers={"Location": "/login"})
              return user

          # ---------- Setup ----------
          @app.get("/setup", response_class=HTMLResponse)
          async def setup_page(request: Request):
              if is_password_set():
                  return RedirectResponse(url="/login")
              return templates.TemplateResponse("setup.html", {"request": request})

          @app.post("/setup")
          async def setup(request: Request, password: str = Form(...), confirm: str = Form(...)):
              if is_password_set():
                  return RedirectResponse(url="/login")
              if password != confirm:
                  return templates.TemplateResponse("setup.html", {"request": request, "error": "Passwords do not match"})
              if len(password) < 4:
                  return templates.TemplateResponse("setup.html", {"request": request, "error": "Password too short (min 4 chars)"})
              save_config({"password_hash": pwd_context.hash(password)})
              return RedirectResponse(url="/login", status_code=HTTP_303_SEE_OTHER)

          # ---------- Login / Logout ----------
          @app.get("/login", response_class=HTMLResponse)
          async def login_page(request: Request):
              if not is_password_set():
                  return RedirectResponse(url="/setup")
              return templates.TemplateResponse("login.html", {"request": request})

          @app.post("/login")
          async def login(request: Request, password: str = Form(...)):
              if not is_password_set():
                  return RedirectResponse(url="/setup")
              if verify_password(password):
                  request.session["user"] = "admin"
                  return RedirectResponse(url="/", status_code=HTTP_303_SEE_OTHER)
              return templates.TemplateResponse("login.html", {"request": request, "error": "Wrong password"})

          @app.get("/logout")
          async def logout(request: Request):
              request.session.clear()
              return RedirectResponse(url="/login")

          # ---------- Dashboard ----------
          @app.get("/", response_class=HTMLResponse)
          async def dashboard(request: Request, user: str = Depends(get_user)):
              local_models = [f.name for f in MODELS_DIR.glob("*.gguf")]
              current = manager.current_model_name or "None"
              return templates.TemplateResponse(
                  "dashboard.html",
                  {"request": request, "user": user, "models": local_models, "current": current}
              )

          @app.post("/load-model")
          async def load_model(request: Request, model_name: str = Form(...), user: str = Depends(get_user)):
              model_path = MODELS_DIR / model_name
              if not model_path.exists():
                  return templates.TemplateResponse(
                      "dashboard.html",
                      {"request": request, "user": user,
                       "models": [f.name for f in MODELS_DIR.glob("*.gguf")],
                       "current": manager.current_model_name or "None",
                       "error": f"Model file '{model_name}' not found locally."}
                  )
              try:
                  manager.load_model(str(model_path), model_name)
              except Exception as e:
                  return templates.TemplateResponse(
                      "dashboard.html",
                      {"request": request, "user": user,
                       "models": [f.name for f in MODELS_DIR.glob("*.gguf")],
                       "current": manager.current_model_name or "None",
                       "error": f"Load failed: {e}"}
                  )
              return RedirectResponse(url="/", status_code=HTTP_303_SEE_OTHER)

          @app.post("/download-model")
          async def download_model(request: Request, repo_id: str = Form(...), filename: str = Form(...), user: str = Depends(get_user)):
              try:
                  hf_hub_download(
                      repo_id=repo_id,
                      filename=filename,
                      local_dir=str(MODELS_DIR)
                  )
              except Exception as e:
                  return templates.TemplateResponse(
                      "dashboard.html",
                      {"request": request, "user": user,
                       "models": [f.name for f in MODELS_DIR.glob("*.gguf")],
                       "current": manager.current_model_name or "None",
                       "error": f"Download failed: {e}"}
                  )
              return RedirectResponse(url="/", status_code=HTTP_303_SEE_OTHER)

          # ---------- OpenAI-compatible ----------
          @app.get("/v1/models")
          async def list_models(user: str = Depends(get_user)):
              model_id = manager.current_model_name or "none"
              return {"object": "list", "data": [{"id": model_id, "object": "model", "created": 0, "owned_by": "local"}]}

          @app.post("/v1/chat/completions")
          async def chat_completions(request: Request, user: str = Depends(get_user)):
              body = await request.json()
              try:
                  return JSONResponse(content=manager.generate(
                      body.get("messages", []),
                      body.get("max_tokens", 512),
                      body.get("temperature", 0.7)
                  ))
              except Exception as e:
                  raise HTTPException(status_code=500, detail=str(e))

          @app.post("/v1/completions")
          async def completions(request: Request, user: str = Depends(get_user)):
              body = await request.json()
              messages = [{"role": "user", "content": body.get("prompt", "")}]
              try:
                  response = manager.generate(messages, body.get("max_tokens", 512), body.get("temperature", 0.7))
                  return JSONResponse(content={
                      "id": f"cmpl-{uuid.uuid4()}",
                      "object": "text_completion",
                      "created": 0,
                      "model": manager.current_model_name or "none",
                      "choices": [{"text": response["choices"][0]["message"]["content"], "index": 0, "logprobs": None, "finish_reason": "stop"}],
                      "usage": response.get("usage", {})
                  })
              except Exception as e:
                  raise HTTPException(status_code=500, detail=str(e))

          # ---------- Health (unauthenticated, for checks) ----------
          @app.get("/health")
          async def health():
              return {"status": "ok", "model": manager.current_model_name or "none"}
          PYEOF

          cat > proxy/templates/setup.html << 'HTMLEOF'
          <!DOCTYPE html><html><head><title>Setup</title></head><body>
          <h2>Welcome! Set up your admin password</h2>
          {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
          <form method="post" action="/setup">
            <label>Password: <input name="password" type="password" required></label><br>
            <label>Confirm: <input name="confirm" type="password" required></label><br>
            <button type="submit">Save password</button>
          </form></body></html>
          HTMLEOF

          cat > proxy/templates/login.html << 'HTMLEOF'
          <!DOCTYPE html><html><head><title>Login</title></head><body>
          <h2>Sign in</h2>
          {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
          <form method="post" action="/login">
            <label>Password: <input name="password" type="password" required></label><br>
            <button type="submit">Login</button>
          </form></body></html>
          HTMLEOF

          cat > proxy/templates/dashboard.html << 'HTMLEOF'
          <!DOCTYPE html><html><head><title>LLM Dashboard</title></head><body>
          <h2>Welcome, {{ user }}! <a href="/logout">Logout</a></h2>
          <p><strong>Current model:</strong> {{ current }}</p>
          {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
          <h3>Load an existing model</h3>
          <form method="post" action="/load-model">
            <select name="model_name">
              {% for m in models %}<option value="{{ m }}" {% if m == current %}selected{% endif %}>{{ m }}</option>{% endfor %}
            </select>
            <button type="submit">Load</button>
          </form>
          <hr>
          <h3>Download a new model from Hugging Face</h3>
          <form method="post" action="/download-model">
            <input name="repo_id" placeholder="e.g. TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF" size="60" required><br>
            <input name="filename" placeholder="e.g. tinyllama-1.1b-chat-v1.0.Q8_0.gguf" size="60" required><br>
            <button type="submit">Download</button>
          </form>
          <hr>
          <p>OpenAI-SDK endpoint: <code>https://&lt;your-tunnel&gt;/v1</code></p>
          </body></html>
          HTMLEOF

      - name: Start Custom Proxy (with health check)
        run: |
          cd proxy
          nohup uvicorn main:app --host 127.0.0.1 --port 8000 > proxy.log 2>&1 &
          echo $! > proxy.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "✅ Proxy is up after ${i}s"
              curl -s http://127.0.0.1:8000/health
              exit 0
            fi
            sleep 1
          done
          echo "❌ Proxy failed to start. Log:"
          cat proxy.log
          exit 1

      - name: Dump proxy log on failure
        if: failure()
        run: |
          echo "=== proxy.log ==="
          cat proxy/proxy.log 2>/dev/null || echo "(no log)"
          echo "=== ps ==="
          ps aux | grep -E "uvicorn|python" | grep -v grep || true

      - name: Expose via Cloudflare Tunnel
        run: |
          # Force IPv4 to avoid the [::1] connection-refused issue
          cloudflared tunnel --url http://127.0.0.1:8000 --no-autoupdate
