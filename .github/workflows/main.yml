                    <div style="font-weight: 600;">{{ m }}</div>
                  </div>
                  <button class="btn-danger" onclick="unloadModel('{{ m }}')">Unload</button>
                </div>
                {% endfor %}
              {% else %}
                <p class="muted">No models currently loaded in RAM.</p>
              {% endif %}
            </div>

            {% if available_models %}
            <div class="card">
              <h2>Load New Model</h2>
              <form id="loadModelForm" class="row">
                <select name="model_name" id="modelSelect">
                  {% for m in available_models %}
                  <option value="{{ m }}">{{ m }}</option>
                  {% endfor %}
                </select>
                <button type="submit">Load Model</button>
              </form>
            </div>
            {% endif %}

            <div class="card">
              <h2>API Access</h2>
              <label>Base URL</label>
              <div class="input-group">
                <input type="text" id="baseUrl" value="{{ base_url }}/v1" readonly class="mono">
                <button type="button" class="btn-secondary" onclick="copyText(document.getElementById('baseUrl').value, this)">Copy</button>
              </div>
              <p class="hint">Manage your access tokens in the <a href="/keys" style="color: var(--primary);">API Keys</a> tab.</p>
            </div>
          </div>

          <script>
            document.getElementById('loadModelForm').addEventListener('submit', async (e) => {
              e.preventDefault();
              showLoading(`Loading model into RAM...`);
              const res = await fetch('/api/load-model', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model_name: document.getElementById('modelSelect').value })
              });
              if (res.ok) window.location.reload();
              else { alert((await res.json()).error); hideLoading(); }
            });

            async function unloadModel(name) {
              showLoading(`Unloading model... (This may take a moment)`);
              await fetch('/api/unload-model', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model_name: name })
              });
              // Give the background thread 3 seconds to free the RAM before reloading
              setTimeout(() => window.location.reload(), 3000);
            }
          </script>
          {% endblock %}
          HTMLEOF

          # ---------- playground.html ----------
          cat > proxy/templates/playground.html << 'HTMLEOF'
          {% extends "base.html" %}
          {% block body %}
          <div class="container">
            <div class="header">
              <div class="logo">🚀 <span>AI Suite</span></div>
              <div class="row">
                <a href="/" class="nav-link">Dashboard</a>
                <a href="/playground" class="nav-link active">Playground</a>
                <a href="/keys" class="nav-link">API Keys</a>
                <a href="/store" class="nav-link">Store</a>
                <span class="muted" style="margin: 0;">{{ user }}</span>
                <a href="/logout" class="btn btn-secondary">Logout</a>
              </div>
            </div>

            <div class="card" style="flex: 1; display: flex; flex-direction: column; height: 80vh;">
              
              <div class="row" style="margin-bottom: 1rem;">
                <select id="modelSelect" style="flex: 1; margin: 0;">
                  {% for m in loaded_models %}
                  <option value="{{ m }}">{{ m }}</option>
                  {% else %}
                  <option value="">No models loaded</option>
                  {% endfor %}
                </select>
              </div>

              <div style="margin-bottom: 1rem;">
                <details>
                  <summary style="cursor: pointer; color: #94a3b8; font-size: 0.85rem; margin-bottom: 0.5rem;">⚙️ System Prompt</summary>
                  <textarea id="systemPrompt" rows="3" placeholder="You are a helpful assistant. Answer directly without showing your thinking process.">You are a helpful assistant. Answer directly without showing your thinking process.</textarea>
                </details>
              </div>
              
              <div id="chatBox" style="flex: 1; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; background: rgba(15, 23, 42, 0.6);">
                <div class="muted" style="text-align: center; margin-top: 2rem;">Start a conversation...</div>
              </div>

              <form id="chatForm" class="row">
                <input type="text" id="chatInput" placeholder="Type a message..." style="flex: 1; margin: 0;" required {% if not loaded_models %}disabled{% endif %}>
                <button type="submit" {% if not loaded_models %}disabled{% endif %}>Send</button>
              </form>
            </div>
          </div>

          <script>
            const chatBox = document.getElementById('chatBox');
            const chatForm = document.getElementById('chatForm');
            const chatInput = document.getElementById('chatInput');
            const modelSelect = document.getElementById('modelSelect');
            const systemPromptInput = document.getElementById('systemPrompt');
            let history = [];

            function appendMessage(role, text) {
              const div = document.createElement('div');
              div.style.marginBottom = '1rem';
              div.style.padding = '0.75rem';
              div.style.borderRadius = '8px';
              div.style.background = role === 'user' ? 'rgba(59, 130, 246, 0.1)' : 'rgba(30, 41, 59, 0.8)';
              div.innerHTML = `<strong>${role === 'user' ? 'You' : 'AI'}:</strong> ${text}`;
              chatBox.appendChild(div);
              chatBox.scrollTop = chatBox.scrollHeight;
              return div;
            }

            chatForm.addEventListener('submit', async (e) => {
              e.preventDefault();
              const text = chatInput.value;
              chatInput.value = '';
              appendMessage('user', text);
              history.push({ role: 'user', content: text });

              const aiDiv = appendMessage('assistant', '...');
              
              let sysPrompt = systemPromptInput.value.trim();
              let messagesToSend = sysPrompt ? [{ role: 'system', content: sysPrompt }, ...history] : history;

              try {
                const res = await fetch('/v1/chat/completions', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    model: modelSelect.value,
                    messages: messagesToSend,
                    stream: true
                  })
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let aiText = '';

                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  const chunk = decoder.decode(value);
                  const lines = chunk.split('\n');
                  
                  for (const line of lines) {
                    if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                      try {
                        const data = JSON.parse(line.slice(6));
                        if (data.choices && data.choices[0].delta.content) {
                          aiText += data.choices[0].delta.content;
                          
                          let thinkingHtml = "";
                          let cleanText = aiText;
                          
                          cleanText = cleanText.replace(/<think>([\s\S]*?)<\/think>/g, (match, p1) => {
                              thinkingHtml += `<details style="margin-bottom: 0.5rem; background: rgba(0,0,0,0.2); border-radius: 4px; padding: 0.5rem;"><summary style="cursor: pointer; color: #94a3b8; font-size: 0.85rem;">🧠 Thinking Process</summary><div style="margin-top: 0.5rem; font-size: 0.85rem; color: #cbd5e1; font-family: monospace; white-space: pre-wrap;">${p1.trim()}</div></details>`;
                              return "";
                          });
                          
                          cleanText = cleanText.replace(/<think>([\s\S]*)$/, (match, p1) => {
                              thinkingHtml += `<details open style="margin-bottom: 0.5rem; background: rgba(0,0,0,0.2); border-radius: 4px; padding: 0.5rem;"><summary style="cursor: pointer; color: #94a3b8; font-size: 0.85rem;">🧠 Thinking Process...</summary><div style="margin-top: 0.5rem; font-size: 0.85rem; color: #cbd5e1; font-family: monospace; white-space: pre-wrap;">${p1.trim()}</div></details>`;
                              return "";
                          });

                          aiDiv.innerHTML = `<strong>AI:</strong><br>${thinkingHtml}<div class="markdown-body" style="margin-top: 0.5rem;">${marked.parse(cleanText)}</div>`;
                          chatBox.scrollTop = chatBox.scrollHeight;
                        }
                      } catch (err) {}
                    }
                  }
                }
                history.push({ role: 'assistant', content: aiText });
              } catch (err) {
                aiDiv.innerHTML = `<strong>AI:</strong> <span style="color: var(--error)">Error: ${err.message}</span>`;
              }
            });
          </script>
          {% endblock %}
          HTMLEOF

          # ---------- keys.html ----------
          cat > proxy/templates/keys.html << 'HTMLEOF'
          {% extends "base.html" %}
          {% block body %}
          <div class="container">
            <div class="header">
              <div class="logo">🚀 <span>AI Suite</span></div>
              <div class="row">
                <a href="/" class="nav-link">Dashboard</a>
                <a href="/playground" class="nav-link">Playground</a>
                <a href="/keys" class="nav-link active">API Keys</a>
                <a href="/store" class="nav-link">Store</a>
                <span class="muted" style="margin: 0;">{{ user }}</span>
                <a href="/logout" class="btn btn-secondary">Logout</a>
              </div>
            </div>

            <div class="card">
              <h2>Create New Key</h2>
              <form id="createKeyForm">
                <div class="row" style="margin-bottom: 1rem;">
                  <div style="flex: 2;">
                    <label>Key Name</label>
                    <input type="text" id="keyName" placeholder="e.g. App Key" required>
                  </div>
                  <div style="flex: 1;">
                    <label>Expires (Days)</label>
                    <input type="number" id="keyExpiry" placeholder="0 = Never" value="0">
                  </div>
                  <div style="flex: 1;">
                    <label>Max Requests</label>
                    <input type="number" id="keyReqLimit" placeholder="0 = ∞" value="0">
                  </div>
                  <div style="flex: 1;">
                    <label>Max Tokens</label>
                    <input type="number" id="keyTokLimit" placeholder="0 = ∞" value="0">
                  </div>
                </div>
                <button type="submit">Generate Key</button>
              </form>
              <div id="newKeyDisplay" style="display: none; margin-top: 1rem; padding: 1rem; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 8px;">
                <p style="margin-bottom: 0.5rem; color: var(--success); font-weight: 600;">Key Generated Successfully!</p>
                <div class="input-group">
                  <input type="text" id="generatedKey" readonly class="mono">
                  <button type="button" onclick="copyText(document.getElementById('generatedKey').value, this)">Copy</button>
                </div>
              </div>
            </div>

            <div class="card">
              <h2>Existing Keys</h2>
              <table style="width: 100%; border-collapse: collapse; margin-top: 1rem;">
                <thead>
                  <tr>
                    <th style="text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border);">Name</th>
                    <th style="text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border);">Key</th>
                    <th style="text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border);">Usage (Req / Tokens)</th>
                    <th style="text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border);">Expires</th>
                    <th style="text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border);">Status</th>
                    <th style="text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border);">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {% for k in keys %}
                  <tr>
                    <td style="padding: 0.75rem; border-bottom: 1px solid var(--border);">{{ k.name }}</td>
                    <td style="padding: 0.75rem; border-bottom: 1px solid var(--border);"><code class="mono">{{ k.masked }}</code></td>
                    <td style="padding: 0.75rem; border-bottom: 1px solid var(--border);">
                      {{ k.requests_used }} / {{ '∞' if k.max_requests == 0 else k.max_requests }} req<br>
                      {{ k.tokens_used }} / {{ '∞' if k.max_tokens == 0 else k.max_tokens }} tok
                    </td>
                    <td style="padding: 0.75rem; border-bottom: 1px solid var(--border);">{{ k.expires_str }}</td>
                    <td style="padding: 0.75rem; border-bottom: 1px solid var(--border);">
                      <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.5rem; background: {{ 'var(--success)' if k.active else 'var(--error)' }};"></span>
                      {{ 'Active' if k.active else 'Revoked' }}
                    </td>
                    <td style="padding: 0.75rem; border-bottom: 1px solid var(--border);">
                      <button class="btn-secondary" style="padding: 0.3rem 0.6rem; font-size: 0.75rem;" onclick="toggleKey('{{ k.id }}')">
                        {{ 'Disable' if k.active else 'Enable' }}
                      </button>
                      <button class="btn-danger" style="padding: 0.3rem 0.6rem; font-size: 0.75rem;" onclick="deleteKey('{{ k.id }}')">
                        Delete
                      </button>
                    </td>
                  </tr>
                  {% endfor %}
                </tbody>
              </table>
            </div>
          </div>

          <script>
            document.getElementById('createKeyForm').addEventListener('submit', async (e) => {
              e.preventDefault();
              showLoading('Generating key...');
              const res = await fetch('/api/keys', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  name: document.getElementById('keyName').value,
                  expires_days: document.getElementById('keyExpiry').value,
                  max_req: document.getElementById('keyReqLimit').value,
                  max_tok: document.getElementById('keyTokLimit').value
                })
              });
              if (res.ok) {
                const data = await res.json();
                document.getElementById('newKeyDisplay').style.display = 'block';
                document.getElementById('generatedKey').value = data.key;
                document.getElementById('createKeyForm').reset();
                hideLoading();
                setTimeout(() => window.location.reload(), 10000);
              } else {
                alert('Failed to create key.'); hideLoading();
              }
            });

            async function toggleKey(id) {
              await fetch(`/api/keys/${id}/toggle`, { method: 'PUT' });
              window.location.reload();
            }

            async function deleteKey(id) {
              if (confirm('Delete this key permanently?')) {
                await fetch(`/api/keys/${id}`, { method: 'DELETE' });
                window.location.reload();
              }
            }
          </script>
          {% endblock %}
          HTMLEOF

          # ---------- store.html ----------
          cat > proxy/templates/store.html << 'HTMLEOF'
          {% extends "base.html" %}
          {% block body %}
          <div class="container">
            <div class="header">
              <div class="logo">🚀 <span>AI Suite</span></div>
              <div class="row">
                <a href="/" class="nav-link">Dashboard</a>
                <a href="/playground" class="nav-link">Playground</a>
                <a href="/keys" class="nav-link">API Keys</a>
                <a href="/store" class="nav-link active">Store</a>
                <span class="muted" style="margin: 0;">{{ user }}</span>
                <a href="/logout" class="btn btn-secondary">Logout</a>
              </div>
            </div>

            <div class="card">
              <h2>Discover Text Models</h2>
              <div class="row" style="margin-bottom: 1rem;">
                <input type="text" id="searchInput" placeholder="Search model name..." style="margin: 0; flex: 1;">
                <button id="searchBtn" style="margin: 0;">Search</button>
              </div>
            </div>

            <div id="resultsContainer" class="card" style="display: none;">
              <h2>Results</h2>
              <div id="resultsList"></div>
            </div>
          </div>

          <script>
            async function searchModels() {
              const q = document.getElementById('searchInput').value;
              
              showLoading('Searching...');
              const url = `/api/store/search?q=${encodeURIComponent(q)}`;
              const res = await fetch(url);
              const models = await res.json();
              hideLoading();
              
              const list = document.getElementById('resultsList');
              list.innerHTML = models.length ? '' : '<p class="muted">No models found.</p>';
              
              models.forEach(m => {
                const safeId = m.id.replace(/[^a-zA-Z0-9]/g, '_');
                list.innerHTML += `
                  <div class="row" style="border-bottom: 1px solid var(--border); padding: 0.75rem 0;">
                    <div style="flex: 1;">
                      <div style="font-weight: 600;">${m.id} ${m.is_vision ? '<span class="badge loaded">Vision</span>' : ''}</div>
                      <div class="muted">${m.downloads} downloads</div>
                    </div>
                    <div id="actions_${safeId}">
                      <button class="btn-secondary" onclick="fetchFiles('${m.id}', this)">Get Files</button>
                    </div>
                  </div>
                `;
              });
              document.getElementById('resultsContainer').style.display = 'block';
            }

            document.getElementById('searchBtn').addEventListener('click', searchModels);
            document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') searchModels(); });
            
            window.onload = searchModels;

            async function fetchFiles(repoId, btn) {
              btn.innerText = 'Fetching...';
              const res = await fetch(`/api/store/files?repo_id=${encodeURIComponent(repoId)}`);
              const data = await res.json();
              if (data.files.length === 0) { btn.innerText = 'No GGUF'; return; }
              
              const selectId = 'select_' + repoId.replace(/[^a-zA-Z0-9]/g, '_');
              let options = data.files.map(f => `<option value="${f}">${f}</option>`).join('');
              btn.parentElement.innerHTML = `
                <div class="row">
                  <select id="${selectId}" style="padding: 0.4rem; max-width: 200px; font-size: 0.8rem; margin: 0;">${options}</select>
                  <button onclick="downloadSelected('${repoId}', '${selectId}')">Download</button>
                </div>
              `;
            }

            async function downloadSelected(repoId, selectId) {
              const filename = document.getElementById(selectId).value;
              showLoading(`Downloading ${filename}...<br><small>This may take a few minutes.</small>`);
              const res = await fetch('/api/download-model', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ repo_id: repoId, filename: filename })
              });
              if (res.ok) window.location.href = '/';
              else { alert('Download failed.'); hideLoading(); }
            }
          </script>
          {% endblock %}
          HTMLEOF

      - name: Start Custom Proxy
        run: |
          cd proxy
          nohup python -u -m uvicorn main:app --host 127.0.0.1 --port 8000 > proxy.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do
            if ! kill -0 $PID 2>/dev/null; then
              echo "❌ Uvicorn process died!"; cat proxy.log; exit 1
            fi
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "✅ Proxy is up after ${i}s"; break
            fi
            sleep 1
          done

      - name: Expose via Cloudflare Tunnel
        run: |
          cloudflared tunnel --url http://127.0.0.1:8000 --no-autoupdate
