name: Ultimate AI Suite

on:
  workflow_dispatch:

jobs:
  deploy-ai-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Add Swap Space and Optimize Swappiness
        run: |
          sudo fallocate -l 8G /mnt/large-swapfile
          sudo chmod 600 /mnt/large-swapfile
          sudo mkswap /mnt/large-swapfile
          sudo swapon /mnt/large-swapfile
          sudo sysctl vm.swappiness=10
          free -h

      - name: Install Python Dependencies
        run: |
          pip install llama-cpp-python[server] \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            --prefer-binary
          pip install huggingface-hub fastapi uvicorn jinja2 python-multipart itsdangerous psutil
          # AirLLM and its optional compression support
          pip install airllm
          pip install bitsandbytes  # optional, for 4-bit/8-bit compression on Linux

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Write Ultimate Proxy Application
        run: |
          mkdir -p proxy/templates proxy/data proxy/models

          cat > proxy/main.py << 'PYEOF'
          import os
          os.environ["HF_XET_HIGH_PERFORMANCE"] = "1"
          os.environ["HF_HUB_ENABLE_HF_TRANSFER"] = "1"

          cpu_count = os.cpu_count() or 4
          physical_cores = max(1, cpu_count // 2) if cpu_count > 2 else cpu_count
          os.environ["OMP_NUM_THREADS"] = str(cpu_count)
          os.environ["OPENBLAS_NUM_THREADS"] = str(cpu_count)

          import json
          import uuid
          import hashlib
          import secrets
          import time
          import traceback
          import threading
          import asyncio
          import datetime
          import psutil
          import queue
          from pathlib import Path
          from typing import Optional, AsyncGenerator, List, Dict, Any

          from fastapi import FastAPI, Request, Form, Depends, HTTPException, Query
          from fastapi.responses import HTMLResponse, RedirectResponse, JSONResponse, StreamingResponse
          from fastapi.templating import Jinja2Templates
          from starlette.middleware.sessions import SessionMiddleware
          from starlette.status import HTTP_303_SEE_OTHER
          from huggingface_hub import hf_hub_download, HfApi
          from llama_cpp import Llama

          # ---------- AirLLM import (optional, so the app still runs if not installed) ----------
          try:
              from airllm import AutoModel as AirLLMAutoModel
              AIRLLM_AVAILABLE = True
          except ImportError:
              AirLLMAutoModel = None
              AIRLLM_AVAILABLE = False

          try:
              from llama_cpp.llama_chat_format import MTMDChatHandler
          except ImportError:
              MTMDChatHandler = None

          # ---------- Configuration ----------
          BASE_DIR = Path(__file__).parent.resolve()
          SECRET_KEY = secrets.token_hex(32)
          CONFIG_FILE = BASE_DIR / "data" / "config.json"
          KEYS_FILE = BASE_DIR / "data" / "keys.json"
          MODELS_DIR = BASE_DIR / "models"
          TEMPLATES_DIR = BASE_DIR / "templates"
          MODELS_DIR.mkdir(exist_ok=True)
          CONFIG_FILE.parent.mkdir(exist_ok=True)

          app = FastAPI()
          app.add_middleware(SessionMiddleware, secret_key=SECRET_KEY)
          templates = Jinja2Templates(directory=str(TEMPLATES_DIR))
          hf_api = HfApi()

          state_lock = threading.Lock()
          inference_lock = threading.Lock()

          # ---------- Key Management System (unchanged) ----------
          def load_keys() -> List[Dict[str, Any]]:
              if not KEYS_FILE.exists():
                  default_key = create_key_obj("Default Admin Key")
                  save_keys([default_key])
                  return [default_key]
              try: return json.loads(KEYS_FILE.read_text())
              except: return []

          def save_keys(keys: List[Dict[str, Any]]):
              with state_lock: KEYS_FILE.write_text(json.dumps(keys, indent=2))

          def create_key_obj(name: str, expires_days: int = 0, max_req: int = 0, max_tok: int = 0) -> Dict[str, Any]:
              now = int(time.time())
              expires_at = now + (expires_days * 86400) if expires_days > 0 else 0
              return {
                  "id": str(uuid.uuid4()), "name": name, "key": "sk-" + secrets.token_hex(24),
                  "created_at": now, "expires_at": expires_at,
                  "max_requests": max_req, "requests_used": 0,
                  "max_tokens": max_tok, "tokens_used": 0, "active": True
              }

          def increment_usage(key_id: str, tokens_used: int):
              with state_lock:
                  keys = load_keys()
                  for k in keys:
                      if k["id"] == key_id:
                          k["requests_used"] += 1
                          k["tokens_used"] += tokens_used
                          break
                  save_keys(keys)

          # ---------- Model Manager with Runtime Abstraction ----------
          class BaseModel:
              """Common interface for both llama-cpp and AirLLM backends."""
              def generate(self, messages, **kwargs) -> dict:
                  raise NotImplementedError
              def stream(self, messages, **kwargs) -> AsyncGenerator[dict, None]:
                  raise NotImplementedError
              def close(self):
                  pass

          class LlamaCppModel(BaseModel):
              def __init__(self, model_path: str, n_ctx: int = 4096):
                  self.llm = Llama(
                      model_path=model_path,
                      n_ctx=n_ctx,
                      n_threads=physical_cores,
                      n_threads_batch=cpu_count,
                      n_batch=512,
                      n_gpu_layers=0,
                      use_mlock=True,
                      use_mmap=True,
                      verbose=False,
                  )
                  self.model_name = Path(model_path).name

              def generate(self, messages, max_tokens=2048, **kwargs):
                  return self.llm.create_chat_completion(
                      messages=messages,
                      max_tokens=max_tokens,
                      **kwargs
                  )

              async def stream(self, messages, max_tokens=2048, **kwargs):
                  # llama-cpp-python supports streaming natively
                  for chunk in self.llm.create_chat_completion(
                      messages=messages,
                      max_tokens=max_tokens,
                      stream=True,
                      **kwargs
                  ):
                      yield chunk

              def close(self):
                  self.llm.close()

          class AirLLMModel(BaseModel):
              def __init__(self, repo_id: str, compression: str = None):
                  if not AIRLLM_AVAILABLE:
                      raise RuntimeError("AirLLM is not installed. Install it with `pip install airllm`.")
                  # AirLLM handles sharding and caching internally
                  self.model = AirLLMAutoModel.from_pretrained(
                      repo_id,
                      compression=compression,  # "4bit", "8bit", or None
                  )
                  self.repo_id = repo_id
                  self.tokenizer = self.model.tokenizer

              def _format_prompt(self, messages: List[Dict[str, str]]) -> str:
                  """Convert OpenAI-style messages to a single prompt string."""
                  # Use the tokenizer's chat template if available
                  if hasattr(self.tokenizer, "apply_chat_template"):
                      return self.tokenizer.apply_chat_template(
                          messages, tokenize=False, add_generation_prompt=True
                      )
                  # Fallback: simple concatenation
                  prompt = ""
                  for m in messages:
                      role = m.get("role", "user")
                      content = m.get("content", "")
                      prompt += f"{role}: {content}\n"
                  prompt += "assistant:"
                  return prompt

              def generate(self, messages, max_tokens=512, **kwargs):
                  prompt = self._format_prompt(messages)
                  input_tokens = self.tokenizer(
                      [prompt],
                      return_tensors="pt",
                      return_attention_mask=False,
                      truncation=True,
                      max_length=4096,
                  )
                  output = self.model.generate(
                      input_tokens["input_ids"],
                      max_new_tokens=max_tokens,
                      use_cache=True,
                      return_dict_in_generate=True,
                  )
                  text = self.tokenizer.decode(
                      output.sequences[0], skip_special_tokens=True
                  )
                  # Remove the prompt part (AirLLM returns the full sequence)
                  if text.startswith(prompt):
                      text = text[len(prompt):].lstrip()
                  return {
                      "choices": [{"message": {"role": "assistant", "content": text}}],
                      "usage": {
                          "prompt_tokens": len(input_tokens["input_ids"][0]),
                          "completion_tokens": len(output.sequences[0]) - len(input_tokens["input_ids"][0]),
                          "total_tokens": len(output.sequences[0]),
                      },
                  }

              async def stream(self, messages, max_tokens=512, **kwargs):
                  """
                  AirLLM does not expose a native streaming API. We simulate
                  token-by-token streaming by generating one token at a time.
                  This is slower but provides a streaming-like experience.
                  """
                  prompt = self._format_prompt(messages)
                  input_tokens = self.tokenizer(
                      [prompt],
                      return_tensors="pt",
                      return_attention_mask=False,
                      truncation=True,
                      max_length=4096,
                  )
                  input_ids = input_tokens["input_ids"]
                  generated = input_ids.clone()
                  prompt_len = input_ids.shape[1]

                  for _ in range(max_tokens):
                      output = self.model.generate(
                          generated,
                          max_new_tokens=1,
                          use_cache=True,
                          return_dict_in_generate=True,
                      )
                      new_token = output.sequences[0][-1:]
                      generated = output.sequences  # update full sequence
                      token_text = self.tokenizer.decode(
                          new_token, skip_special_tokens=True
                      )
                      if token_text:
                          yield {
                              "choices": [{
                                  "delta": {"content": token_text},
                                  "index": 0,
                                  "finish_reason": None,
                              }]
                          }
                      # Stop on EOS token (implementation may vary)
                      if new_token.item() == self.tokenizer.eos_token_id:
                          break

                  yield {
                      "choices": [{
                          "delta": {},
                          "index": 0,
                          "finish_reason": "stop",
                      }]
                  }

              def close(self):
                  # AirLLM does not have an explicit close method; rely on GC
                  pass

          class ModelManager:
              def __init__(self):
                  self.models: Dict[str, BaseModel] = {}
                  self.model_runtimes: Dict[str, str] = {}  # model_name -> "llama-cpp" or "airllm"
                  self.last_stats: dict = {}

              def load_model(self, model_identifier: str, runtime: str = "llama-cpp", **kwargs):
                  """
                  Load a model with the chosen runtime.
                  - For llama-cpp, model_identifier is the filename of a .gguf file in MODELS_DIR.
                  - For airllm, model_identifier is a Hugging Face repo ID (e.g., "meta-llama/Llama-3-70B").
                  """
                  if runtime not in ("llama-cpp", "airllm"):
                      raise HTTPException(status_code=400, detail="Runtime must be 'llama-cpp' or 'airllm'")

                  if model_identifier in self.models:
                      return

                  if runtime == "llama-cpp":
                      model_path = MODELS_DIR / model_identifier
                      if not model_path.exists():
                          raise HTTPException(status_code=404, detail=f"Model file '{model_identifier}' not found in {MODELS_DIR}")
                      # Memory check (existing logic)
                      file_size = os.path.getsize(model_path)
                      free_ram = psutil.virtual_memory().available
                      free_swap = psutil.swap_memory().free
                      total_free = free_ram + free_swap
                      if file_size + (1024 * 1024 * 1024) > total_free:
                          raise HTTPException(
                              status_code=413,
                              detail=f"OOM Risk: Model needs {file_size/1e9:.1f}GB, but only {total_free/1e9:.1f}GB available."
                          )
                      with inference_lock:
                          model = LlamaCppModel(str(model_path), n_ctx=4096)
                          self.models[model_identifier] = model
                          self.model_runtimes[model_identifier] = "llama-cpp"

                  elif runtime == "airllm":
                      if not AIRLLM_AVAILABLE:
                          raise HTTPException(status_code=503, detail="AirLLM is not available. Install it with `pip install airllm`.")
                      with inference_lock:
                          compression = kwargs.get("compression")  # e.g., "4bit"
                          model = AirLLMModel(model_identifier, compression=compression)
                          self.models[model_identifier] = model
                          self.model_runtimes[model_identifier] = "airllm"

              def unload_model(self, model_name: str):
                  with inference_lock:
                      if model_name in self.models:
                          try:
                              self.models[model_name].close()
                          except:
                              pass
                          del self.models[model_name]
                          del self.model_runtimes[model_name]

              def get_model(self, model_name: str) -> BaseModel:
                  if model_name not in self.models:
                      if not self.models:
                          raise RuntimeError("No models loaded. Please load a model first.")
                      model_name = list(self.models.keys())[0]
                  return self.models[model_name]

              def get_runtime(self, model_name: str) -> str:
                  return self.model_runtimes.get(model_name, "llama-cpp")

              def generate_sync(self, model_name: str, messages, **kwargs):
                  with inference_lock:
                      model = self.get_model(model_name)
                      t0 = time.time()
                      max_tokens = kwargs.pop("max_tokens", 2048)
                      result = model.generate(messages, max_tokens=max_tokens, **kwargs)
                      elapsed = time.time() - t0
                      if isinstance(result, dict):
                          result["model"] = model_name
                          usage = result.get("usage", {})
                          completion_tokens = usage.get("completion_tokens", 0)
                          tps = completion_tokens / elapsed if elapsed > 0 else 0
                          result["timings"] = {
                              "total_time": round(elapsed, 3),
                              "completion_tokens": completion_tokens,
                              "tokens_per_second": round(tps, 2),
                          }
                          self.last_stats = result["timings"]
                      return result

              def stream_worker(self, model_name: str, messages, q: queue.Queue, stop_event: threading.Event, **kwargs):
                  """Run the synchronous streaming generator in a thread and push chunks to a queue."""
                  try:
                      with inference_lock:
                          model = self.get_model(model_name)
                          max_tokens = kwargs.pop("max_tokens", 2048)
                          # For llama-cpp, use its native streaming; for AirLLM, use our simulated stream
                          # We'll call the async stream method from a thread using asyncio
                          loop = asyncio.new_event_loop()
                          asyncio.set_event_loop(loop)
                          async def run_stream():
                              async for chunk in model.stream(messages, max_tokens=max_tokens, **kwargs):
                                  if stop_event.is_set():
                                      break
                                  q.put(chunk)
                          loop.run_until_complete(run_stream())
                          loop.close()
                  except Exception as e:
                      q.put({"error": str(e)})
                  finally:
                      q.put(None)

              async def stream_async(self, model_name: str, messages, key_id: str, request: Request, **kwargs) -> AsyncGenerator[str, None]:
                  stop_event = threading.Event()
                  q = queue.Queue()
                  threading.Thread(
                      target=self.stream_worker,
                      args=(model_name, messages, q, stop_event),
                      kwargs=kwargs,
                      daemon=True
                  ).start()

                  completion_tokens = 0
                  yield ": keep-alive\n\n"

                  try:
                      while True:
                          if await request.is_disconnected():
                              stop_event.set()
                              break

                          try:
                              chunk = await asyncio.wait_for(asyncio.to_thread(q.get), timeout=15.0)
                          except asyncio.TimeoutError:
                              yield ": keep-alive\n\n"
                              continue

                          if chunk is None:
                              break

                          if "error" in chunk:
                              yield f"data: {json.dumps({'error': chunk['error']})}\n\n"
                              break

                          if isinstance(chunk, dict):
                              chunk["model"] = model_name
                              if chunk.get("choices"):
                                  delta = chunk["choices"][0].get("delta", {})
                                  if delta.get("content") or delta.get("tool_calls"):
                                      completion_tokens += 1

                          yield f"data: {json.dumps(chunk)}\n\n"
                          await asyncio.sleep(0.01)

                      yield "data: [DONE]\n\n"
                      if not await request.is_disconnected():
                          await asyncio.to_thread(increment_usage, key_id, completion_tokens)

                  except asyncio.CancelledError:
                      stop_event.set()
                      raise
                  finally:
                      stop_event.set()

              async def generate_async(self, model_name: str, messages, **kwargs):
                  return await asyncio.to_thread(self.generate_sync, model_name, messages, **kwargs)

          manager = ModelManager()

          # ---------- Config Helpers (unchanged) ----------
          def hash_password(password: str) -> str:
              salt = secrets.token_hex(16)
              return f"{salt}${hashlib.pbkdf2_hmac('sha256', password.encode(), salt.encode(), 100_000).hex()}"

          def check_password(password: str, stored: str) -> bool:
              try:
                  salt, expected = stored.split('$', 1)
                  return secrets.compare_digest(hashlib.pbkdf2_hmac('sha256', password.encode(), salt.encode(), 100_000).hex(), expected)
              except: return False

          def load_config(): return json.loads(CONFIG_FILE.read_text()) if CONFIG_FILE.exists() else {}
          def save_config(cfg): CONFIG_FILE.write_text(json.dumps(cfg))

          # ---------- Auth Dependencies (unchanged) ----------
          def require_user(request: Request):
              user = request.session.get("user")
              if not user:
                  raise HTTPException(status_code=303, headers={"Location": "/login"})
              return user

          def require_api_user(request: Request):
              user = request.session.get("user")
              if user: return {"id": "admin-session", "name": "WebUI Admin"}

              auth = request.headers.get("Authorization", "")
              if not auth.startswith("Bearer "): raise HTTPException(status_code=401, detail="Missing token")

              token = auth[7:]
              for k in load_keys():
                  if k["key"] == token:
                      if not k["active"]: raise HTTPException(status_code=403, detail="Key revoked")
                      if k["expires_at"] > 0 and time.time() > k["expires_at"]: raise HTTPException(status_code=403, detail="Key expired")
                      if k["max_requests"] > 0 and k["requests_used"] >= k["max_requests"]: raise HTTPException(status_code=429, detail="Rate limit exceeded (Requests)")
                      if k["max_tokens"] > 0 and k["tokens_used"] >= k["max_tokens"]: raise HTTPException(status_code=429, detail="Rate limit exceeded (Tokens)")
                      return k
              raise HTTPException(status_code=401, detail="Invalid API key")

          # ---------- Web UI Routes (updated for runtime selection) ----------
          @app.get("/setup", response_class=HTMLResponse)
          async def setup_page(request: Request):
              if "password_hash" in load_config(): return RedirectResponse(url="/login")
              return templates.TemplateResponse(request, "setup.html", {})

          @app.post("/setup")
          async def setup(request: Request, password: str = Form(...), confirm: str = Form(...)):
              if "password_hash" in load_config(): return RedirectResponse(url="/login")
              if password != confirm or len(password) < 4: return templates.TemplateResponse(request, "setup.html", {"error": "Invalid password."})
              save_config({"password_hash": hash_password(password)})
              return RedirectResponse(url="/login", status_code=HTTP_303_SEE_OTHER)

          @app.get("/login", response_class=HTMLResponse)
          async def login_page(request: Request):
              if "password_hash" not in load_config(): return RedirectResponse(url="/setup")
              return templates.TemplateResponse(request, "login.html", {})

          @app.post("/login")
          async def login(request: Request, password: str = Form(...)):
              if check_password(password, load_config().get("password_hash", "")):
                  request.session["user"] = "admin"
                  return RedirectResponse(url="/", status_code=HTTP_303_SEE_OTHER)
              return templates.TemplateResponse(request, "login.html", {"error": "Wrong password."})

          @app.get("/logout")
          async def logout(request: Request):
              request.session.clear()
              return RedirectResponse(url="/login")

          @app.get("/", response_class=HTMLResponse)
          async def dashboard(request: Request, user: str = Depends(require_user)):
              loaded_models = list(manager.models.keys())
              # Available GGUF models (local files) for llama-cpp
              gguf_models = sorted(f.name for f in MODELS_DIR.glob("*.gguf") if f.name not in loaded_models)
              # AirLLM models are loaded by repo ID, so we don't list local files for them.
              # But we can show loaded AirLLM models separately if needed.
              return templates.TemplateResponse(request, "dashboard.html", {
                  "user": user,
                  "loaded_models": loaded_models,
                  "available_gguf_models": gguf_models,
                  "airllm_available": AIRLLM_AVAILABLE,
                  "base_url": str(request.base_url).rstrip("/")
              })

          @app.get("/playground", response_class=HTMLResponse)
          async def playground_page(request: Request, user: str = Depends(require_user)):
              return templates.TemplateResponse(request, "playground.html", {
                  "user": user, "loaded_models": list(manager.models.keys())
              })

          @app.get("/keys", response_class=HTMLResponse)
          async def keys_page(request: Request, user: str = Depends(require_user)):
              keys = load_keys()
              for k in keys:
                  k["masked"] = f"{k['key'][:8]}...{k['key'][-4:]}"
                  if k["expires_at"] == 0:
                      k["expires_str"] = "Never"
                  else:
                      k["expires_str"] = datetime.datetime.fromtimestamp(k["expires_at"]).strftime('%Y-%m-%d')
              return templates.TemplateResponse(request, "keys.html", {"user": user, "keys": keys})

          @app.get("/store", response_class=HTMLResponse)
          async def store_page(request: Request, user: str = Depends(require_user)):
              return templates.TemplateResponse(request, "store.html", {"user": user, "airllm_available": AIRLLM_AVAILABLE})

          # ---------- Management APIs (updated for runtime selection) ----------
          @app.get("/api/keys")
          async def api_list_keys(user: dict = Depends(require_api_user)):
              return load_keys()

          @app.post("/api/keys")
          async def api_create_key(request: Request, user: dict = Depends(require_api_user)):
              b = await request.json()
              new_key = create_key_obj(b.get("name", "Key"), int(b.get("expires_days", 0)), int(b.get("max_req", 0)), int(b.get("max_tok", 0)))
              keys = load_keys(); keys.append(new_key); save_keys(keys)
              return new_key

          @app.delete("/api/keys/{key_id}")
          async def api_delete_key(key_id: str, user: dict = Depends(require_api_user)):
              save_keys([k for k in load_keys() if k["id"] != key_id])
              return {"status": "deleted"}

          @app.put("/api/keys/{key_id}/toggle")
          async def api_toggle_key(key_id: str, user: dict = Depends(require_api_user)):
              keys = load_keys()
              for k in keys:
                  if k["id"] == key_id: k["active"] = not k["active"]
              save_keys(keys); return {"status": "toggled"}

          @app.post("/api/load-model")
          async def api_load_model(request: Request, user: dict = Depends(require_api_user)):
              b = await request.json()
              model_identifier = b.get("model_name")
              runtime = b.get("runtime", "llama-cpp")
              if runtime == "llama-cpp":
                  path = MODELS_DIR / model_identifier
                  if not path.exists():
                      return JSONResponse(status_code=404, content={"error": "Model file not found"})
                  identifier = model_identifier
              else:  # airllm
                  identifier = model_identifier  # repo ID
              try:
                  await asyncio.to_thread(
                      manager.load_model,
                      identifier,
                      runtime=runtime,
                      compression=b.get("compression")
                  )
                  return {"status": "ok"}
              except HTTPException as e:
                  return JSONResponse(status_code=e.status_code, content={"error": e.detail})
              except Exception as e:
                  return JSONResponse(status_code=500, content={"error": str(e)})

          @app.post("/api/unload-model")
          async def api_unload_model(request: Request, user: dict = Depends(require_api_user)):
              b = await request.json()
              asyncio.create_task(asyncio.to_thread(manager.unload_model, b.get("model_name")))
              return {"status": "unloading"}

          @app.get("/api/store/search")
          async def api_store_search(q: str = "", vision_only: bool = False):
              try:
                  models = await asyncio.to_thread(
                      hf_api.list_models,
                      search=q,
                      filter="gguf",  # For AirLLM, we actually want non-GGUF models
                      pipeline_tag="text-generation",
                      sort="downloads",
                      limit=30,
                      expand=["tags"]
                  )
                  res = []
                  for m in models:
                      is_v = any(t in (m.tags or []) for t in ["vision", "multimodal"])
                      if not vision_only or is_v:
                          res.append({"id": m.id, "downloads": m.downloads, "is_vision": is_v})
                  return res
              except Exception as e:
                  return JSONResponse(status_code=500, content={"error": str(e)})

          @app.get("/api/store/search-big")
          async def api_store_search_big(q: str = ""):
              """Search for large models suitable for AirLLM (no parameter limit)."""
              try:
                  models = await asyncio.to_thread(
                      hf_api.list_models,
                      search=q,
                      pipeline_tag="text-generation",
                      sort="downloads",
                      limit=30,
                      expand=["tags"]
                  )
                  res = []
                  for m in models:
                      # We can try to get parameter count from tags or model card, but it's not always available.
                      # For now, just return all text-generation models.
                      res.append({"id": m.id, "downloads": m.downloads})
                  return res
              except Exception as e:
                  return JSONResponse(status_code=500, content={"error": str(e)})

          @app.get("/api/store/files")
          async def api_store_files(repo_id: str, user: dict = Depends(require_api_user)):
              files = await asyncio.to_thread(hf_api.list_repo_files, repo_id=repo_id)
              return {"repo_id": repo_id, "files": sorted([f for f in files if f.endswith(".gguf")])}

          @app.post("/api/download-model")
          async def api_download_model(request: Request, user: dict = Depends(require_api_user)):
              b = await request.json()
              await asyncio.to_thread(hf_hub_download, repo_id=b.get("repo_id"), filename=b.get("filename"), local_dir=str(MODELS_DIR))
              return {"status": "ok"}

          # ---------- OpenAI-compatible API (updated for runtime selection) ----------
          @app.get("/v1/models")
          async def list_models(user: dict = Depends(require_api_user)):
              loaded = list(manager.models.keys())
              data = []
              for m in loaded:
                  data.append({
                      "id": m,
                      "object": "model",
                      "created": int(time.time()),
                      "owned_by": "local",
                      "runtime": manager.get_runtime(m)
                  })
              return {"object": "list", "data": data}

          @app.post("/v1/chat/completions")
          async def chat_completions(request: Request, user: dict = Depends(require_api_user)):
              body = await request.json()
              model_name = body.pop("model", "auto")
              messages = body.pop("messages", [])
              stream = body.pop("stream", False)
              # Optional runtime override; if not provided, the manager uses the model's registered runtime
              runtime_override = body.pop("runtime", None)
              if runtime_override:
                  # If runtime is explicitly specified, ensure it matches the loaded model's runtime
                  actual_runtime = manager.get_runtime(model_name) if model_name in manager.models else None
                  if actual_runtime and actual_runtime != runtime_override:
                      raise HTTPException(status_code=400, detail=f"Model '{model_name}' is loaded with runtime '{actual_runtime}', not '{runtime_override}'")
              try:
                  if stream:
                      return StreamingResponse(
                          manager.stream_async(model_name, messages, user["id"], request, **body),
                          media_type="text/event-stream",
                          headers={"Cache-Control": "no-cache", "Connection": "keep-alive", "X-Accel-Buffering": "no"}
                      )
                  res = await manager.generate_async(model_name, messages, **body)
                  await asyncio.to_thread(increment_usage, user["id"], res.get("usage", {}).get("completion_tokens", 0))
                  return JSONResponse(content=res)
              except Exception as e:
                  return JSONResponse(status_code=500, content={"error": str(e)})

          @app.get("/health")
          async def health():
              return {
                  "status": "ok",
                  "loaded_models": list(manager.models.keys()),
                  "airllm_available": AIRLLM_AVAILABLE,
              }
          PYEOF

