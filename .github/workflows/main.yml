          # ---------- dashboard.html (updated with runtime selection) ----------
          cat > proxy/templates/dashboard.html << 'HTMLEOF'
          {% extends "base.html" %}
          {% block body %}
          <div class="container">
            <div class="header">
              <div class="logo">AI Suite</div>
              <div class="row">
                <a href="/" class="nav-link active">Dashboard</a>
                <a href="/playground" class="nav-link">Playground</a>
                <a href="/keys" class="nav-link">API Keys</a>
                <a href="/store" class="nav-link">Store</a>
                <span class="muted" style="margin-left: 1rem;">{{ user }}</span>
                <a href="/logout" class="btn-secondary">Logout</a>
              </div>
            </div>

            <div class="card">
              <h2>Loaded Models</h2>
              {% if loaded_models %}
                {% for m in loaded_models %}
                <div class="row" style="border-bottom: 1px solid var(--border); padding: 0.75rem 0;">
                  <div style="flex: 1;">
                    <strong>{{ m }}</strong>
                    <span class="badge" style="margin-left: 0.5rem;">{{ manager.get_runtime(m) }}</span>
                  </div>
                  <button class="btn-danger" onclick="unloadModel('{{ m }}')">Unload</button>
                </div>
                {% endfor %}
              {% else %}
                <p class="muted">No models currently loaded.</p>
              {% endif %}
            </div>

            {% if available_gguf_models or airllm_available %}
            <div class="card">
              <h2>Load Model</h2>
              <form id="loadModelForm">
                <div class="row" style="margin-bottom: 1rem;">
                  <div style="flex: 1;">
                    <label>Runtime</label>
                    <select id="runtimeSelect" name="runtime">
                      <option value="llama-cpp" selected>llama-cpp (GGUF)</option>
                      {% if airllm_available %}
                      <option value="airllm">AirLLM (Hugging Face)</option>
                      {% endif %}
                    </select>
                  </div>
                  <div style="flex: 1;" id="ggufSelector">
                    <label>GGUF Model File</label>
                    <select id="ggufModelSelect" name="model_name">
                      {% for m in available_gguf_models %}
                      <option value="{{ m }}">{{ m }}</option>
                      {% endfor %}
                    </select>
                  </div>
                  <div style="flex: 1; display: none;" id="airllmSelector">
                    <label>Hugging Face Repo ID</label>
                    <input type="text" id="airllmRepoInput" placeholder="e.g. meta-llama/Llama-3-70B" style="margin: 0;">
                  </div>
                </div>
                <div class="row" style="margin-bottom: 1rem; display: none;" id="airllmOptions">
                  <div style="flex: 1;">
                    <label>Compression (optional)</label>
                    <select id="compressionSelect">
                      <option value="">None</option>
                      <option value="4bit">4-bit (requires bitsandbytes)</option>
                      <option value="8bit">8-bit (requires bitsandbytes)</option>
                    </select>
                  </div>
                </div>
                <button type="submit">Load</button>
              </form>
            </div>
            {% endif %}

            <div class="card">
              <h2>API Configuration</h2>
              <label>Base URL</label>
              <div class="input-group">
                <input type="text" id="baseUrl" value="{{ base_url }}/v1" readonly>
                <button class="btn-secondary" onclick="copyText(document.getElementById('baseUrl').value, this)">Copy</button>
              </div>
            </div>
          </div>

          <script>
            const runtimeSelect = document.getElementById('runtimeSelect');
            const ggufSelector = document.getElementById('ggufSelector');
            const airllmSelector = document.getElementById('airllmSelector');
            const airllmOptions = document.getElementById('airllmOptions');

            runtimeSelect.addEventListener('change', () => {
              if (runtimeSelect.value === 'airllm') {
                ggufSelector.style.display = 'none';
                airllmSelector.style.display = 'block';
                airllmOptions.style.display = 'block';
              } else {
                ggufSelector.style.display = 'block';
                airllmSelector.style.display = 'none';
                airllmOptions.style.display = 'none';
              }
            });

            document.getElementById('loadModelForm').addEventListener('submit', async (e) => {
              e.preventDefault();
              showLoading(`Loading model...`);
              const runtime = runtimeSelect.value;
              const modelName = runtime === 'llama-cpp'
                ? document.getElementById('ggufModelSelect').value
                : document.getElementById('airllmRepoInput').value.trim();
              if (!modelName) {
                alert('Please enter a model name.');
                hideLoading();
                return;
              }
              const payload = {
                model_name: modelName,
                runtime: runtime,
                compression: runtime === 'airllm' ? document.getElementById('compressionSelect').value || undefined : undefined,
              };
              const res = await fetch('/api/load-model', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              if (res.ok) window.location.reload();
              else {
                const err = await res.json();
                alert(err.error || 'Failed to load model.');
                hideLoading();
              }
            });

            async function unloadModel(name) {
              showLoading(`Unloading...`);
              await fetch('/api/unload-model', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model_name: name })
              });
              setTimeout(() => window.location.reload(), 2000);
            }
          </script>
          {% endblock %}
          HTMLEOF

