name: Ultimate AI Suite (Text < 9B, Image Store, Keys)

on:
  workflow_dispatch:

jobs:
  deploy-ai-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Pre-built stable-diffusion.cpp (CPU)
        run: |
          echo "Fetching the latest release from GitHub API..."
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/leejet/stable-diffusion.cpp/releases/latest)
          
          # Find the asset matching the Linux CPU x86_64 pattern
          ASSET_URL=$(echo "$LATEST_RELEASE" | jq -r '.assets[] | select(.name | test("bin-Linux.*x86_64.*\\.zip$")) | .browser_download_url' | head -n 1)
          
          if [ -z "$ASSET_URL" ]; then
            echo "❌ Could not find a Linux x86_64 asset in the latest release."
            echo "$LATEST_RELEASE" | jq -r '.assets[].name' # Print available assets for debugging
            exit 1
          fi
          
          echo "Downloading: $ASSET_URL"
          curl -L -o sd.cpp.zip "$ASSET_URL"
          
          echo "Extracting..."
          unzip -q sd.cpp.zip -d sd_bin
          
          # Locate the sd-cli binary
          SD_CLI=$(find sd_bin -name "sd-cli" -type f | head -n 1)
          if [ -z "$SD_CLI" ]; then
            echo "❌ sd-cli binary not found in the archive."
            ls -R sd_bin
            exit 1
          fi
          
          chmod +x "$SD_CLI"
          echo "✅ Found sd-cli at: $SD_CLI"
          
          # Create a stable symlink for the backend to use
          mkdir -p stable-diffusion.cpp/build/bin
          ln -sf "$(pwd)/$SD_CLI" stable-diffusion.cpp/build/bin/sd-cli

      - name: Add Swap Space and Optimize Swappiness
        run: |
          sudo fallocate -l 8G /mnt/large-swapfile
          sudo chmod 600 /mnt/large-swapfile
          sudo mkswap /mnt/large-swapfile
          sudo swapon /mnt/large-swapfile
          sudo sysctl vm.swappiness=10
          free -h

      - name: Install Python Dependencies
        run: |
          pip install llama-cpp-python[server] \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            --prefer-binary
          pip install huggingface-hub fastapi uvicorn jinja2 python-multipart itsdangerous pillow

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Write Ultimate Proxy Application
        run: |
          mkdir -p proxy/templates proxy/data proxy/models proxy/sd_models

          cat > proxy/main.py << 'PYEOF'
          import os
          import json
          import uuid
          import hashlib
          import secrets
          import time
          import traceback
          import threading
          import asyncio
          import subprocess
          import base64
          import datetime
          from pathlib import Path
          from typing import Optional, AsyncGenerator, List, Dict, Any

          from fastapi import FastAPI, Request, Form, Depends, HTTPException, Query
          from fastapi.responses import HTMLResponse, RedirectResponse, JSONResponse, StreamingResponse
          from fastapi.templating import Jinja2Templates
          from starlette.middleware.sessions import SessionMiddleware
          from starlette.status import HTTP_303_SEE_OTHER
          from huggingface_hub import hf_hub_download, HfApi
          from llama_cpp import Llama

          try:
              from llama_cpp.llama_chat_format import MTMDChatHandler
          except ImportError:
              MTMDChatHandler = None

          # ---------- Configuration ----------
          BASE_DIR = Path(__file__).parent.resolve()
          SECRET_KEY = secrets.token_hex(32)
          CONFIG_FILE = BASE_DIR / "data" / "config.json"
          KEYS_FILE = BASE_DIR / "data" / "keys.json"
          MODELS_DIR = BASE_DIR / "models"
          SD_MODELS_DIR = BASE_DIR / "sd_models"
          TEMPLATES_DIR = BASE_DIR / "templates"
          MODELS_DIR.mkdir(exist_ok=True)
          SD_MODELS_DIR.mkdir(exist_ok=True)
          CONFIG_FILE.parent.mkdir(exist_ok=True)

          SD_BIN = BASE_DIR.parent / "stable-diffusion.cpp" / "build" / "bin" / "sd-cli"

          app = FastAPI()
          app.add_middleware(SessionMiddleware, secret_key=SECRET_KEY)
          templates = Jinja2Templates(directory=str(TEMPLATES_DIR))
          hf_api = HfApi()

          state_lock = threading.Lock()
          inference_lock = threading.Lock()
          image_lock = threading.Lock()

          # ---------- Curated Image Models (Small, SD.cpp compatible) ----------
          POPULAR_IMAGE_MODELS = [
              {
                  "id": "stabilityai/sd-turbo",
                  "name": "SD-Turbo (Fast, Small)",
                  "filename": "sd_turbo.safetensors",
                  "repo_id": "stabilityai/sd-turbo",
                  "type": "image",
                  "size": "small",
                  "steps": 1
              },
              {
                  "id": "OlegSkutte/sdxl-turbo-GGUF",
                  "name": "SDXL-Turbo (GGUF, Medium)",
                  "filename": "sd_xl_turbo_1.0.q8_0.gguf",
                  "repo_id": "OlegSkutte/sdxl-turbo-GGUF",
                  "type": "image",
                  "size": "medium",
                  "steps": 1
              },
              {
                  "id": "FINAL-Bench/POCKET-Zimage-CPU",
                  "name": "POCKET-Zimage (3 steps)",
                  "filename": "z_image_turbo-Q4_0-pocket.gguf",
                  "repo_id": "FINAL-Bench/POCKET-Zimage-CPU",
                  "type": "image",
                  "size": "small",
                  "steps": 3
              }
          ]

          # ---------- Key Management System ----------
          def load_keys() -> List[Dict[str, Any]]:
              if not KEYS_FILE.exists():
                  default_key = create_key_obj("Default Admin Key")
                  save_keys([default_key])
                  return [default_key]
              try: return json.loads(KEYS_FILE.read_text())
              except: return []

          def save_keys(keys: List[Dict[str, Any]]):
              with state_lock: KEYS_FILE.write_text(json.dumps(keys, indent=2))

          def create_key_obj(name: str, expires_days: int = 0, max_req: int = 0, max_tok: int = 0) -> Dict[str, Any]:
              now = int(time.time())
              expires_at = now + (expires_days * 86400) if expires_days > 0 else 0
              return {
                  "id": str(uuid.uuid4()), "name": name, "key": "sk-" + secrets.token_hex(24),
                  "created_at": now, "expires_at": expires_at,
                  "max_requests": max_req, "requests_used": 0,
                  "max_tokens": max_tok, "tokens_used": 0, "active": True
              }

          def increment_usage(key_id: str, tokens_used: int):
              with state_lock:
                  keys = load_keys()
                  for k in keys:
                      if k["id"] == key_id:
                          k["requests_used"] += 1
                          k["tokens_used"] += tokens_used
                          break
                  save_keys(keys)

          # ---------- Image Generation Manager ----------
          class ImageManager:
              def __init__(self):
                  self.current_model = None

              def download_model(self, repo_id: str, filename: str):
                  print(f"[image] Downloading {repo_id}/{filename}...", flush=True)
                  hf_hub_download(repo_id=repo_id, filename=filename, local_dir=str(SD_MODELS_DIR))
                  if "POCKET-Zimage" in repo_id:
                      hf_hub_download(repo_id="Tongyi-MAI/Z-Image-Turbo", filename="vae/diffusion_pytorch_model.safetensors", local_dir=str(SD_MODELS_DIR))
                      hf_hub_download(repo_id="lmstudio-community/Qwen3-4B-Instruct-2507-GGUF", filename="Qwen3-4B-Instruct-2507-Q4_K_M.gguf", local_dir=str(SD_MODELS_DIR))

              def generate(self, prompt: str, steps: int = 4, width: int = 512, height: int = 512):
                  if not self.current_model:
                      raise RuntimeError("No image model selected. Go to the Store and select one.")

                  with image_lock:
                      output_file = str(BASE_DIR / f"tmp_{uuid.uuid4().hex}.png")
                      model_file = SD_MODELS_DIR / self.current_model["filename"]

                      cmd = [
                          str(SD_BIN), "-M", "img_gen",
                          "--diffusion-model", str(model_file),
                          "-p", prompt, "--cfg-scale", "1.0",
                          "-H", str(height), "-W", str(width),
                          "--steps", str(steps),
                          "--offload-to-cpu", "--diffusion-fa", "--vae-tiling",
                          "-o", output_file
                      ]

                      if "POCKET-Zimage" in self.current_model["id"]:
                          cmd.extend([
                              "--vae", str(SD_MODELS_DIR / "vae" / "diffusion_pytorch_model.safetensors"),
                              "--llm", str(SD_MODELS_DIR / "Qwen3-4B-Instruct-2507-Q4_K_M.gguf")
                          ])

                      print(f"[image] Generating: '{prompt}'...", flush=True)
                      result = subprocess.run(cmd, capture_output=True, text=True)

                      if result.returncode != 0:
                          raise RuntimeError(f"sd-cli failed: {result.stderr[:200]}")

                      with open(output_file, "rb") as f:
                          img_str = base64.b64encode(f.read()).decode("utf-8")
                      os.remove(output_file)
                      return img_str

          image_manager = ImageManager()

          # ---------- Model Manager (Text) ----------
          class ModelManager:
              def __init__(self):
                  self.current_llm: Optional[Llama] = None
                  self.current_model_name: Optional[str] = None
                  self.last_stats: dict = {}

              def load_model(self, model_path: str, model_name: str):
                  with inference_lock:
                      if self.current_llm is not None:
                          try: self.current_llm.close()
                          except: pass
                          self.current_llm = None
                      safe_threads = max(1, (os.cpu_count() or 4) - 1)
                      self.current_llm = Llama(
                          model_path=model_path, n_ctx=4096, n_threads=safe_threads,
                          n_gpu_layers=0, use_mlock=True, verbose=False
                      )
                      self.current_model_name = model_name

          manager = ModelManager()

          # ---------- Config Helpers ----------
          def hash_password(password: str) -> str:
              salt = secrets.token_hex(16)
              return f"{salt}${hashlib.pbkdf2_hmac('sha256', password.encode(), salt.encode(), 100_000).hex()}"

          def check_password(password: str, stored: str) -> bool:
              try:
                  salt, expected = stored.split('$', 1)
                  return secrets.compare_digest(hashlib.pbkdf2_hmac('sha256', password.encode(), salt.encode(), 100_000).hex(), expected)
              except: return False

          def load_config(): return json.loads(CONFIG_FILE.read_text()) if CONFIG_FILE.exists() else {}
          def save_config(cfg): CONFIG_FILE.write_text(json.dumps(cfg))

          # ---------- Auth Dependencies ----------
          def require_user(request: Request):
              user = request.session.get("user")
              if not user: 
                  raise HTTPException(status_code=303, headers={"Location": "/login"})
              return user

          def require_api_user(request: Request):
              user = request.session.get("user")
              if user: return {"id": "admin-session", "name": "WebUI Admin"}

              auth = request.headers.get("Authorization", "")
              if not auth.startswith("Bearer "): raise HTTPException(status_code=401, detail="Missing token")
              
              token = auth[7:]
              for k in load_keys():
                  if k["key"] == token:
                      if not k["active"]: raise HTTPException(status_code=403, detail="Key revoked")
                      if k["expires_at"] > 0 and time.time() > k["expires_at"]: raise HTTPException(status_code=403, detail="Key expired")
                      if k["max_requests"] > 0 and k["requests_used"] >= k["max_requests"]: raise HTTPException(status_code=429, detail="Rate limit exceeded (Requests)")
                      if k["max_tokens"] > 0 and k["tokens_used"] >= k["max_tokens"]: raise HTTPException(status_code=429, detail="Rate limit exceeded (Tokens)")
                      return k
              raise HTTPException(status_code=401, detail="Invalid API key")

          # ---------- Web UI Routes ----------
          @app.get("/setup", response_class=HTMLResponse)
          async def setup_page(request: Request):
              if "password_hash" in load_config(): return RedirectResponse(url="/login")
              return templates.TemplateResponse(request, "setup.html", {})

          @app.post("/setup")
          async def setup(request: Request, password: str = Form(...), confirm: str = Form(...)):
              if "password_hash" in load_config(): return RedirectResponse(url="/login")
              if password != confirm or len(password) < 4: return templates.TemplateResponse(request, "setup.html", {"error": "Invalid password."})
              save_config({"password_hash": hash_password(password)})
              return RedirectResponse(url="/login", status_code=HTTP_303_SEE_OTHER)

          @app.get("/login", response_class=HTMLResponse)
          async def login_page(request: Request):
              if "password_hash" not in load_config(): return RedirectResponse(url="/setup")
              return templates.TemplateResponse(request, "login.html", {})

          @app.post("/login")
          async def login(request: Request, password: str = Form(...)):
              if check_password(password, load_config().get("password_hash", "")):
                  request.session["user"] = "admin"
                  return RedirectResponse(url="/", status_code=HTTP_303_SEE_OTHER)
              return templates.TemplateResponse(request, "login.html", {"error": "Wrong password."})

          @app.get("/logout")
          async def logout(request: Request):
              request.session.clear()
              return RedirectResponse(url="/login")

          @app.get("/", response_class=HTMLResponse)
          async def dashboard(request: Request, user: str = Depends(require_user)):
              return templates.TemplateResponse(request, "dashboard.html", {
                  "user": user, "models": sorted(f.name for f in MODELS_DIR.glob("*.gguf")),
                  "current": manager.current_model_name or "None", "base_url": str(request.base_url).rstrip("/")
              })

          @app.get("/keys", response_class=HTMLResponse)
          async def keys_page(request: Request, user: str = Depends(require_user)):
              keys = load_keys()
              for k in keys: 
                  k["masked"] = f"{k['key'][:8]}...{k['key'][-4:]}"
                  if k["expires_at"] == 0:
                      k["expires_str"] = "Never"
                  else:
                      k["expires_str"] = datetime.datetime.fromtimestamp(k["expires_at"]).strftime('%Y-%m-%d')
              return templates.TemplateResponse(request, "keys.html", {"user": user, "keys": keys})

          @app.get("/store", response_class=HTMLResponse)
          async def store_page(request: Request, user: str = Depends(require_user)):
              return templates.TemplateResponse(request, "store.html", {"user": user, "popular_image_models": POPULAR_IMAGE_MODELS, "current_image_model": image_manager.current_model})

          @app.get("/image", response_class=HTMLResponse)
          async def image_page(request: Request, user: str = Depends(require_user)):
              return templates.TemplateResponse(request, "image.html", {"user": user, "current_model": image_manager.current_model})

          # ---------- Management APIs ----------
          @app.get("/api/keys")
          async def api_list_keys(user: dict = Depends(require_api_user)):
              return load_keys()

          @app.post("/api/keys")
          async def api_create_key(request: Request, user: dict = Depends(require_api_user)):
              b = await request.json()
              new_key = create_key_obj(b.get("name", "Key"), int(b.get("expires_days", 0)), int(b.get("max_req", 0)), int(b.get("max_tok", 0)))
              keys = load_keys(); keys.append(new_key); save_keys(keys)
              return new_key

          @app.delete("/api/keys/{key_id}")
          async def api_delete_key(key_id: str, user: dict = Depends(require_api_user)):
              save_keys([k for k in load_keys() if k["id"] != key_id])
              return {"status": "deleted"}

          @app.put("/api/keys/{key_id}/toggle")
          async def api_toggle_key(key_id: str, user: dict = Depends(require_api_user)):
              keys = load_keys()
              for k in keys:
                  if k["id"] == key_id: k["active"] = not k["active"]
              save_keys(keys); return {"status": "toggled"}

          @app.post("/api/load-model")
          async def api_load_model(request: Request, user: dict = Depends(require_api_user)):
              b = await request.json()
              path = MODELS_DIR / b.get("model_name")
              if not path.exists(): return JSONResponse(status_code=404, content={"error": "Model not found"})
              await asyncio.to_thread(manager.load_model, str(path), b.get("model_name"))
              return {"status": "ok"}

          @app.post("/api/store/select-image-model")
          async def api_select_image_model(request: Request, user: dict = Depends(require_api_user)):
              b = await request.json()
              model_info = next((m for m in POPULAR_IMAGE_MODELS if m["id"] == b.get("model_id")), None)
              if not model_info: raise HTTPException(404, "Model not found")
              
              await asyncio.to_thread(image_manager.download_model, model_info["repo_id"], model_info["filename"])
              image_manager.current_model = model_info
              return {"status": "ok", "model": model_info}

          @app.get("/api/store/search")
          async def api_store_search(q: str = "", model_type: str = "text", vision_only: bool = False):
              if model_type == "image":
                  return [m for m in POPULAR_IMAGE_MODELS if q.lower() in m["name"].lower()]
              
              models = await asyncio.to_thread(hf_api.list_models, search=q, filter="gguf", sort="downloads", limit=30, expand=["tags"], num_parameters="max:9B")
              res = []
              for m in models:
                  is_v = any(t in (m.tags or []) for t in ["vision", "multimodal"])
                  if not vision_only or is_v: res.append({"id": m.id, "downloads": m.downloads, "is_vision": is_v})
              return res

          @app.get("/api/store/files")
          async def api_store_files(repo_id: str, user: dict = Depends(require_api_user)):
              files = await asyncio.to_thread(hf_api.list_repo_files, repo_id=repo_id)
              return {"repo_id": repo_id, "files": sorted([f for f in files if f.endswith(".gguf")])}

          @app.post("/api/download-model")
          async def api_download_model(request: Request, user: dict = Depends(require_api_user)):
              b = await request.json()
              await asyncio.to_thread(hf_hub_download, repo_id=b.get("repo_id"), filename=b.get("filename"), local_dir=str(MODELS_DIR))
              return {"status": "ok"}

          # ---------- AI APIs ----------
          @app.post("/v1/images/generations")
          async def generate_image(request: Request, user: dict = Depends(require_api_user)):
              try:
                  body = await request.json()
                  prompt = body.get("prompt", "")
                  if not prompt: raise HTTPException(status_code=400, detail="Prompt is required")
                  
                  steps = body.get("steps", image_manager.current_model["steps"] if image_manager.current_model else 4)
                  img_b64 = await asyncio.to_thread(image_manager.generate, prompt, steps, body.get("width", 512), body.get("height", 512))
                  
                  return {"created": int(time.time()), "data": [{"b64_json": img_b64}]}
              except Exception as e:
                  return JSONResponse(status_code=500, content={"error": str(e)})

          @app.get("/health")
          async def health():
              return {"status": "ok", "text_model": manager.current_model_name or "none"}
          PYEOF

          # ---------- base.html ----------
          cat > proxy/templates/base.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>{% block title %}AI Suite{% endblock %}</title>
            <style>
              :root { --bg: #0a0e1a; --surface: #1e293b; --border: rgba(148, 163, 184, 0.15); --text: #e2e8f0; --primary: #3b82f6; --success: #10b981; --error: #ef4444; }
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: -apple-system, sans-serif; background: radial-gradient(circle at top, #1e293b 0%, #0a0e1a 60%); color: var(--text); padding: 2rem 1rem; }
              .container { max-width: 900px; margin: 0 auto; }
              .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
              .logo { font-size: 1.25rem; font-weight: 700; } .logo span { background: linear-gradient(135deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; color: transparent; }
              .card { background: rgba(30, 41, 59, 0.8); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.25rem; }
              .card h2 { font-size: 1rem; margin-bottom: 1rem; display: flex; justify-content: space-between; }
              label { display: block; font-size: 0.75rem; margin-bottom: 0.5rem; color: #94a3b8; text-transform: uppercase; }
              input, select { width: 100%; padding: 0.7rem 1rem; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border); border-radius: 8px; color: white; margin-bottom: 1rem; }
              button { padding: 0.7rem 1.5rem; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; }
              button:hover { opacity: 0.9; }
              .btn-secondary { background: #334155; } .btn-danger { background: var(--error); }
              .btn { display: inline-block; padding: 0.5rem 1rem; border-radius: 8px; text-decoration: none; color: white; }
              .row { display: flex; gap: 0.75rem; align-items: center; }
              .input-group { display: flex; gap: 0.5rem; }
              .badge { padding: 0.25rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
              .badge.loaded { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
              .muted { color: #94a3b8; font-size: 0.9rem; }
              .nav-link { color: #94a3b8; text-decoration: none; font-size: 0.875rem; padding: 0.5rem 1rem; border-radius: 8px; }
              .nav-link:hover { background: rgba(148, 163, 184, 0.1); color: white; }
              .nav-link.active { background: rgba(59, 130, 246, 0.1); color: var(--primary); }
              #loadingOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(10, 14, 26, 0.85); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 9999; flex-direction: column; gap: 1rem; text-align: center; padding: 1rem; }
              .spinner { width: 50px; height: 50px; border: 4px solid rgba(59, 130, 246, 0.2); border-left-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
              @keyframes spin { to { transform: rotate(360deg); } }
              #loadingText { font-size: 1.1rem; font-weight: 500; color: white; }
            </style>
          </head>
          <body>
            <div id="loadingOverlay"><div class="spinner"></div><div id="loadingText">Processing...</div></div>
            {% block body %}{% endblock %}
            <script>
              function showLoading(text) { document.getElementById('loadingText').innerHTML = text; document.getElementById('loadingOverlay').style.display = 'flex'; }
              function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }
              function copyText(text, btn) { navigator.clipboard.writeText(text).then(() => { const orig = btn.textContent; btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = orig, 1500); }); }
            </script>
          </body>
          </html>
          HTMLEOF

          # ---------- setup.html ----------
          cat > proxy/templates/setup.html << 'HTMLEOF'
          {% extends "base.html" %}
          {% block body %}
          <div class="auth-wrap" style="max-width: 400px; margin: 6rem auto 2rem;">
            <div class="logo" style="text-align: center; margin-bottom: 1.5rem;">🚀 <span>AI Suite</span></div>
            <div class="card">
              <h2>First-time Setup</h2>
              <p class="muted" style="margin-bottom: 1rem;">Create an admin password.</p>
              {% if error %}<div style="color: var(--error); margin-bottom: 1rem;">{{ error }}</div>{% endif %}
              <form method="post" action="/setup">
                <label>Password</label>
                <input type="password" name="password" required minlength="4" autofocus>
                <label>Confirm</label>
                <input type="password" name="confirm" required minlength="4">
                <button type="submit" style="width: 100%;">Create Password</button>
              </form>
            </div>
          </div>
          {% endblock %}
          HTMLEOF

          # ---------- login.html ----------
          cat > proxy/templates/login.html << 'HTMLEOF'
          {% extends "base.html" %}
          {% block body %}
          <div class="auth-wrap" style="max-width: 400px; margin: 6rem auto 2rem;">
            <div class="logo" style="text-align: center; margin-bottom: 1.5rem;">🚀 <span>AI Suite</span></div>
            <div class="card">
              <h2>Sign in</h2>
              {% if error %}<div style="color: var(--error); margin-bottom: 1rem;">{{ error }}</div>{% endif %}
              <form method="post" action="/login">
                <label>Password</label>
                <input type="password" name="password" required autofocus>
                <button type="submit" style="width: 100%;">Login</button>
              </form>
            </div>
          </div>
          {% endblock %}
